[package]
description = "E2EE envelope crypto shared by the OpenSesame vault and sealed store; reads the Pages vault format"
name = "opensesame-human-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
pbkdf2 = { workspace = true }
unicode-normalization = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
subtle = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3.20.0"
insta = { workspace = true, features = ["redactions"] }
opensesame-domain = { path = "../domain" }
proptest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand 0.10 and the RustCrypto 0.11 crates draw entropy through getrandom 0.4;
# aes-gcm 0.10 still reaches getrandom 0.2 through rand_core 0.6. Each needs
# its own wasm32-unknown-unknown backend switched on.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

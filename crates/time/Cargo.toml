[package]
name = "opensesame-time"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stable date/time boundary preserving OpenSesame wire representations"

[features]
default = ["sqlx"]
sqlx = ["dep:sqlx-core", "dep:sqlx-postgres", "dep:sqlx-sqlite"]

[dependencies]
serde = { workspace = true }
time = { workspace = true }
sqlx-core = { version = "0.9.0", default-features = false, features = ["time"], optional = true }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["time"], optional = true }
sqlx-sqlite = { version = "0.9.0", default-features = false, features = ["bundled"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

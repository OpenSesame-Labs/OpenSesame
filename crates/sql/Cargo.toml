[package]
description = "SQLite utilities for the OpenSesame host store"
name = "opensesame-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "time", "json", "uuid", "migrate"] }
# Pinned to the reviewed vendored patch at patches/vendor/sqlx-sqlite-0.9.0; an
# open "0.9" requirement would let the registry resolve 0.9.1 and silently
# disable the [patch.crates-io] override.
sqlx-sqlite = { version = "=0.9.0", default-features = false, features = ["bundled", "json", "uuid", "migrate"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["time", "json", "uuid", "migrate"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

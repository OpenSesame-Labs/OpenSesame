# Dependency updates. The audit gates (npm run audit:osv, audit:cargo-audit,
# audit:cve-lite) remain the security loop; Dependabot only proposes version
# bumps so the routine dependency triage has a reviewed, ready-made PR.
# Nothing here merges on its own: every update is a pull request a person
# reviews (docs/security/dependency-supply-chain.md).
#
# Every entry carries a seven-day cooldown: a version published less than a
# week ago is not proposed. A hijacked release is usually reported and
# withdrawn inside that window. Security updates are not delayed.
#
# npm workspaces use ONE root entry at / with the root package-lock.json.
# Do not add per-package directories: Dependabot resolves every workspace
# from that single lockfile.
version: 2
updates:
  # Root Cargo workspace (product crates). tests/fuzz/cargo is its own
  # workspace with its own lock and gets its own entry below.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /tests/fuzz/cargo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    ignore:
      # @ai-sdk/openai-compatible 3.x emits provider-spec v4 models, which
      # the pinned ai@6 core (spec v2/v3) cannot accept. Stay on the 2.x
      # line until a coordinated AI SDK 7 migration lands.
      - dependency-name: "@ai-sdk/openai-compatible"
        versions:
          - ">= 3.0.0"
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: testcontainers
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Base images are pinned by digest. One entry per directory that holds a
  # Dockerfile, so a moved tag or a patched base arrives as a reviewed PR.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /ops/compose
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /ops/containers/cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /ops/containers/control-plane
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /ops/containers/web-pwa
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - security
    groups:
      docker-base-images:
        patterns:
          - "*"

# Dependency updates. The audit gates (npm run audit:osv, audit:cargo-audit,
# audit:cve-lite) remain the security loop; Dependabot only proposes version
# bumps so the routine dependency triage has a reviewed, ready-made PR.
#
# npm workspaces: one root package-lock.json at /. Do not add per-workspace npm
# entries — Dependabot resolves every workspace from the root lockfile (npm
# packageManager in package.json), matching the post–npm-migration layout.
version: 2
updates:
  # Root Cargo workspace (product crates). tests/fuzz/cargo is its own
  # workspace with its own lock and gets its own entry below.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /tests/fuzz/cargo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    ignore:
      # @ai-sdk/openai-compatible 3.x emits provider-spec v4 models, which
      # the pinned ai@6 core (spec v2/v3) cannot accept. Stay on the 2.x
      # line until a coordinated AI SDK 7 migration lands.
      - dependency-name: "@ai-sdk/openai-compatible"
        versions:
          - ">= 3.0.0"
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: testcontainers
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

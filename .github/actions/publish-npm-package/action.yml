name: npm publication disabled
description: >-
  Refuse registry publication until immutable npm packages are included in a
  qualified candidate and promoted with independently protected credentials.
inputs:
  working-directory:
    description: Reserved for a future qualified publisher.
    required: false
  npm-dist-tag:
    description: Reserved for a future qualified publisher.
    required: false
  npm-token:
    description: Reserved for a future qualified publisher; never read here.
    required: false
runs:
  using: composite
  steps:
    - name: Refuse unqualified npm publication
      shell: bash
      run: |
        echo "::error::npm publication is disabled until qualified candidate-bound promotion is implemented." >&2
        exit 1

name: Publish npm package
description: >-
  Publish a staged release directory to npm with optional provenance. A
  non-empty npm-token is passed only as NODE_AUTH_TOKEN for that command. An
  empty token leaves registry auth to OIDC trusted publishing (id-token: write).
  Never prints tokens.

inputs:
  working-directory:
    description: Directory that contains the publish package.json and payload files.
    required: true
  npm-dist-tag:
    description: >-
      npm dist-tag for this publish. The stage dry-run uses alpha.
      This action refuses latest. Production publishes with next.
    required: true
  npm-token:
    description: Optional npm token from the GitHub Environment. Leave empty for OIDC.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Pin npm 11.21.1 and configure the npmjs registry
      shell: bash
      env:
        NPM_TOKEN_INPUT: ${{ inputs.npm-token }}
      run: |
        set -euo pipefail
        # npx caches under the runner user. A global install writes
        # /usr/local/share/man and fails with EACCES (exit 243).
        test "$(npx -y npm@11.21.1 --version)" = "11.21.1"
        npmrc="${RUNNER_TEMP}/opensesame-npmjs.npmrc"
        if [ -n "${NPM_TOKEN_INPUT:-}" ]; then
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' \
            > "$npmrc"
        else
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$npmrc"
        fi
        unset NPM_TOKEN_INPUT
        echo "NPM_CONFIG_USERCONFIG=${npmrc}" >> "$GITHUB_ENV"

    - name: Publish to npm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NPM_TOKEN_INPUT: ${{ inputs.npm-token }}
        NPM_DIST_TAG: ${{ inputs.npm-dist-tag }}
      run: |
        set -euo pipefail
        test -n "$NPM_DIST_TAG"
        if [ "$NPM_DIST_TAG" = "latest" ]; then
          echo "Refusing dist-tag latest. Trunk CD publishes 0.0.0-alpha.N with alpha on the stage dry-run and next from Production." >&2
          exit 1
        fi
        version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
        test -n "$version"
        case "$version" in
          *-*) ;;
          *)
            echo "Refusing stable ${version}. Trunk CD publishes 0.0.0-alpha.N only." >&2
            exit 1
            ;;
        esac
        publish_cmd=(npx -y npm@11.21.1 publish --access public --tag "$NPM_DIST_TAG" --provenance)
        if [ -n "${NPM_TOKEN_INPUT:-}" ]; then
          export NODE_AUTH_TOKEN="$NPM_TOKEN_INPUT"
        else
          unset NODE_AUTH_TOKEN
        fi
        unset NPM_TOKEN_INPUT
        if npx -y npm@11.21.1 view "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).name")@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
          echo "${version} is already on the registry."
        else
          "${publish_cmd[@]}"
        fi

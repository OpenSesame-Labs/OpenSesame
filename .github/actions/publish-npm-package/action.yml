name: Publish npm package
description: >-
  Publish a staged release directory to npm with provenance. A non-empty
  npm-token is the only registry credential (NODE_AUTH_TOKEN). That path
  does not attempt OIDC trusted publishing. An empty token leaves registry
  auth to OIDC (id-token: write). Preview publishes 0.0.0-alpha.N on alpha.
  Production publishes the same staged payload as 0.0.0-next.N on next.
  Never prints tokens. Never publishes latest.

inputs:
  working-directory:
    description: Directory that contains the publish package.json and payload files.
    required: true
  npm-dist-tag:
    description: >-
      npm dist-tag for this publish. Preview passes alpha with version
      0.0.0-alpha.N. Production passes next after package.json is rewritten
      to 0.0.0-next.N. This action refuses latest.
    required: true
  npm-token:
    description: >-
      npm token from the GitHub Environment. Non-empty values publish with
      NODE_AUTH_TOKEN only. Leave empty for OIDC trusted publishing.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Prepare integrity-pinned npm 11.21.1 without publication credentials
      shell: bash
      run: |
        set -euo pipefail
        # GitHub makes OIDC request credentials available to every step in
        # an id-token:write job. Keep them, and any inherited registry token,
        # away from the download, verifier, extractor and version probe.
        npm_cli="$(env -i PATH="$PATH" HOME="$HOME" \
          MISE_DATA_DIR="${MISE_DATA_DIR:-$HOME/.local/share/mise}" MISE_YES=1 \
          HTTP_PROXY="${HTTP_PROXY:-}" HTTPS_PROXY="${HTTPS_PROXY:-}" \
          ALL_PROXY="${ALL_PROXY:-}" NO_PROXY="${NO_PROXY:-}" \
          http_proxy="${http_proxy:-}" https_proxy="${https_proxy:-}" \
          all_proxy="${all_proxy:-}" no_proxy="${no_proxy:-}" \
          RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
          bash "${GITHUB_WORKSPACE}/scripts/release/fetch-pinned-npm.sh")"
        printf 'OPENSESAME_NPM_CLI=%s\n' "$npm_cli" >> "$GITHUB_ENV"

    - name: Publish to npm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NPM_TOKEN_INPUT: ${{ inputs.npm-token }}
        NPM_DIST_TAG: ${{ inputs.npm-dist-tag }}
      run: |
        set -euo pipefail
        unset NODE_OPTIONS NODE_PATH
        test -n "$NPM_DIST_TAG"
        if [ "$NPM_DIST_TAG" = "latest" ]; then
          echo "Refusing dist-tag latest. Preview publishes alpha; Production publishes 0.0.0-next.N on next." >&2
          exit 1
        fi
        version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
        test -n "$version"
        case "$NPM_DIST_TAG:$version" in
          alpha:0.0.0-alpha.[0-9]*|next:0.0.0-next.[0-9]*) ;;
          *)
            echo "Refusing ${NPM_DIST_TAG} for ${version}. Trunk CD publishes 0.0.0-alpha.N on alpha or 0.0.0-next.N on next." >&2
            exit 1
            ;;
        esac
        npmrc="${RUNNER_TEMP}/opensesame-npmjs.npmrc"
        printf '%s\n' 'registry=https://registry.npmjs.org/' > "$npmrc"
        export NPM_CONFIG_USERCONFIG="$npmrc"
        printf 'NPM_CONFIG_USERCONFIG=%s\n' "$npmrc" >> "$GITHUB_ENV"
        export NPM_CONFIG_IGNORE_SCRIPTS=true
        # Non-empty token: NODE_AUTH_TOKEN only. Do not try OIDC first.
        # Empty token: OIDC trusted publishing (id-token: write) only.
        # Each publish says which it is, so a stored token is never in quiet
        # use. Only the kind of credential is printed, never a value.
        if [ -n "${NPM_TOKEN_INPUT:-}" ]; then
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> "$npmrc"
          export NODE_AUTH_TOKEN="$NPM_TOKEN_INPUT"
          echo "::warning title=npm credential::This publish uses the stored NPM_TOKEN secret, which outlives the run. Configure the npm trusted publisher and delete the secret: docs/operators/publishing.md."
        else
          unset NODE_AUTH_TOKEN
          echo "::notice title=npm credential::This publish uses OIDC trusted publishing. No stored npm token is read."
        fi
        unset NPM_TOKEN_INPUT
        node "${GITHUB_WORKSPACE}/scripts/release/npm-trunk-publish.mjs"

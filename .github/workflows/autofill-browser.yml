name: Autofill browser E2E

on:
  # Browser tests qualify the frozen prerelease candidate, or run on demand.
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions: {}

concurrency:
  group: autofill-browser-${{ inputs.source_sha && github.run_id || github.ref }}-${{ inputs.source_sha || 'direct' }}
  cancel-in-progress: ${{ !inputs.source_sha }}

jobs:
  browser:
    needs: admit
    if: ${{ !cancelled() && (needs.admit.result == 'success' || (needs.admit.result == 'skipped' && !inputs.source_sha)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.admit.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
          install_args: node
      - name: Install locked autofill dependencies
        run: npm ci -w @opensesame/browser-extension-autofill --ignore-scripts
      # Scorecard treats `npm install` as an unpinned fetch. `npm ci` is pinned.
      # Chromium is installed by that lockfile's @playwright/test CLI.
      - name: Install full Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Exercise the built autofill extension
        env:
          AUTOFILL_E2E_EVIDENCE_DIR: ${{ runner.temp }}/autofill-review
        run: npm run test:e2e -w @opensesame/browser-extension-autofill
      # Review material only: screenshots show the real popup and never the
      # login field, browser profile, pairing bearer, console or daemon state.
      - name: Retain popup captures for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofill-review-${{ inputs.source_sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autofill-review/*.png
          if-no-files-found: ignore
          retention-days: 7

  # The candidate is admitted before any job fetches it: only a full commit
  # already on the default branch. This job holds the token and checks out
  # the workflow SHA only; candidate jobs read its output, never the raw input
  # (scripts/release/admit-candidate-source.mjs, docs/security/actions-security.md).
  admit:
    name: Admit candidate source
    if: ${{ inputs.source_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.admitted.outputs.revision }}
    steps:
      - name: Check out the trusted candidate admission helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release/admit-candidate-source.mjs
            scripts/lib/json-boundary.mjs
      - name: Admit only a candidate already on the default branch
        id: admitted
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: node scripts/release/admit-candidate-source.mjs

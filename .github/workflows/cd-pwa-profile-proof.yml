# Pull-request proof that the full install profile is served from its dist/
# on loopback. Does not publish and does not deploy.
name: CD PWA profile proof

on:
  pull_request:
    paths:
      - "scripts/ci/pwa-*"
      - "apps/pages/scripts/lib/static-origin-harness.mjs"
      - "apps/pages/scripts/lib/verification-checklist-setup.mjs"
      - "apps/pages/scripts/lib/verification-checklist-shot.mjs"
      - "apps/pages/scripts/lib/verification-checklist-profiles.mjs"
      - "apps/pages/scripts/lib/pages-journey.mjs"
      - "apps/pages/scripts/bundle-chunk.mjs"
      - "apps/pages/scripts/saml-browser-crypto.mjs"
      - "apps/pages/capability-profiles/**"
      - ".github/workflows/cd-pwa.yml"
      - ".github/workflows/cd-pwa-profile-proof.yml"

# Read-only mise tool cache restore needs actions: read. This workflow does not save.
permissions: {}

concurrency:
  group: cd-pwa-profile-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Install-profile screenshot (full)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PWA_PROFILE_PROOF_NAME: full
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node 24
        run: bash scripts/lib/install-mise-locked.sh node@24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Profile build and screenshot
        run: node scripts/ci/pwa-install-profile-proof.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-profile-proof-${{ github.run_id }}
          path: artifacts/pwa-profile-proof
          if-no-files-found: error

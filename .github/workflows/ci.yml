# Trunk admission compiles only the affected dependency graph.
# Tests and artifact qualification belong to environment delivery workflows.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Optional Turborepo remote cache. Fork pull requests are read-only.
# An unset TURBO_TOKEN does not authenticate a write. Do not print these.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  # Save primary install caches on main, merge_group, and workflow_dispatch of main.
  # Save the main seed only on push and workflow_dispatch of main.
  # Pull requests, including forks, restore and do not save.
  TRUSTED_CACHE_SAVE: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
  MAIN_CACHE_SEED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Main scope includes failed, cancelled and coalesced pushes since the last
  # successful ancestor. Active main/merge-group builds finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Affected build graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      typescript: ${{ github.event.pull_request.draft == true && 'false' || steps.packages.outputs.selected }}
      rust: ${{ github.event.pull_request.draft == true && 'false' || steps.crates.outputs.selected }}
      rust_shards: ${{ steps.crates.outputs.shards }}
      draft: ${{ github.event.pull_request.draft == true && 'true' || 'false' }}
      linux_runner: ${{ steps.runner.outputs.linux }}
      # The native PWA compiler requires Linux AMD64 on a cold build.
      typescript_runner: ${{ (steps.packages.outputs.scope == 'all' || contains(steps.packages.outputs.packages, '@opensesame/pages')) && '"ubuntu-latest"' || steps.runner.outputs.linux }}
    steps:
      - name: Choose the Linux runner
        id: runner
        # Off unless the repository variable CI_SELF_HOSTED_ARM64 is "true", so
        # the default is GitHub-hosted and flipping it back is the whole rollback.
        # Only the owner's own branches may reach the self-hosted box: this
        # repository is public, and a runner executes whatever the PR contains.
        env:
          ENABLED: ${{ vars.CI_SELF_HOSTED_ARM64 }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          linux='"ubuntu-latest"'
          if [ "$ENABLED" = "true" ] && [ "$ACTOR" = "$OWNER" ] \
            && { [ "$EVENT" != "pull_request" ] || [ "$HEAD_REPO" = "$REPO" ]; }; then
            linux='["self-hosted","linux","ARM64","os-devbox"]'
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Resolve the cumulative integration diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/lib/ci-main-baseline.mjs
      - name: Enforce reviewed exposure combinations
        # Core Node only: this policy runs even when no affected build is selected.
        run: node scripts/security/exposure-matrix-gate.mjs --ref HEAD
      - name: Select affected TypeScript packages
        id: packages
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: node scripts/lib/ci-affected-builds.mjs plan-ts
      - name: Select affected Rust crates
        id: crates
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: node scripts/lib/ci-affected-builds.mjs plan-cargo

  typescript-build:
    # After `changes` only. rust-build has the same edge and no concurrency key,
    # so the two graphs start together.
    name: Build affected TypeScript graph
    needs: [changes]
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.typescript_runner) }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select affected packages
        id: affected
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
        run: node scripts/lib/ci-affected-builds.mjs plan-ts
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-download-v2-${{ runner.os }}-seed-main-
      - name: Install the frozen dependency graph
        run: npm ci
      - name: Save npm download cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
      - name: Save npm main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-seed-main-${{ hashFiles('package-lock.json') }}
      - name: Log npm cache hit
        env:
          CACHE_NAME: npm
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.npm-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.npm-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: npm-download-v2-${{ runner.os }}-seed-main-
        run: node scripts/lib/ci-cache-seed.mjs
      - name: Resolve the Turborepo comparison ref
        id: turbo_base
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: node scripts/lib/ci-turbo-base.mjs
      - name: Prepare the local Turborepo cache key
        id: turbo_local_meta
        env:
          RUNNER_OS: ${{ runner.os }}
        run: node scripts/lib/ci-turbo-local-cache.mjs
      - name: Cache the local Turborepo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ steps.turbo_local_meta.outputs.turbo_local_cache_key }}
          restore-keys: |
            ${{ steps.turbo_local_meta.outputs.turbo_local_restore_prefix }}
      - name: Cache the pinned native PWA distribution
        if: steps.affected.outputs.scope == 'all' || contains(steps.affected.outputs.packages, '@opensesame/pages')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Apply the Turborepo remote cache mode
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: node scripts/lib/ci-turbo-cache.mjs
      - name: Build affected packages and their prerequisites
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          TURBO_COMPARISON_REF: ${{ steps.turbo_base.outputs.turbo_comparison_ref }}
          VITE_BASE: /OpenSesame/
        run: node scripts/lib/ci-affected-builds.mjs run-ts
      - name: Restore full install profile dist cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.affected.outputs.scope == 'all' || contains(steps.affected.outputs.packages, '@opensesame/pages'))
        id: ci-full-profile-dist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/pages/dist-profiles/pwa-proof/full
          key: pwa-full-profile-dist-${{ hashFiles('apps/pages/capability-profiles/full.json', 'apps/pages/package.json', 'package-lock.json', 'tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
          restore-keys: |
            pwa-full-profile-dist-
      - name: Build full install profile dist for CD promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.affected.outputs.scope == 'all' || contains(steps.affected.outputs.packages, '@opensesame/pages'))
        env:
          VERIFY_SKIP_BUILD: ${{ steps.ci-full-profile-dist-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: node scripts/ci/pwa-full-profile-dist-build.mjs
      - name: Save full install profile dist cache
        if: env.TRUSTED_CACHE_SAVE == 'true' && (steps.affected.outputs.scope == 'all' || contains(steps.affected.outputs.packages, '@opensesame/pages'))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/pages/dist-profiles/pwa-proof/full
          key: pwa-full-profile-dist-${{ hashFiles('apps/pages/capability-profiles/full.json', 'apps/pages/package.json', 'package-lock.json', 'tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.affected.outputs.scope == 'all' || contains(steps.affected.outputs.packages, '@opensesame/pages'))
        with:
          name: ci-pwa-full-profile-dist-${{ github.run_id }}
          path: apps/pages/dist-profiles/pwa-proof/full
          if-no-files-found: error

  rust-build:
    # After `changes` only. No edge to typescript-build and no concurrency key.
    # Package shards stay disjoint. Workspace feature edges share a shard.
    name: Build affected Rust graph
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    # GitHub-hosted larger runners stay off. Tyler has not approved them.
    # Opt-in, default off: runs-on ubuntu-latest-4-cores or ubuntu-latest-8-cores,
    # and raise CARGO_BUILD_JOBS to that core count. Do not enable this.
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.rust_shards) }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select affected crates
        id: affected
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
        run: node scripts/lib/ci-affected-builds.mjs plan-cargo
      - name: Install Linux keychain build dependencies
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-rust-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-rust-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-rust-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: rust
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-rust-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-rust-${{ hashFiles('mise.toml', 'mise.lock') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache
        with:
          prefix-key: v0-rust
          shared-key: ${{ github.job }}
          save-if: ${{ env.TRUSTED_CACHE_SAVE == 'true' && matrix.shard == 0 }}
      - name: Log Rust cache hit
        env:
          CACHE_NAME: rust
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: v0-rust-${{ github.job }}
          MAIN_SEED_PREFIX: v0-rust-${{ github.job }}-
        run: |
          export CACHE_PROBE_DIR="${HOME}/.cargo/registry/cache"
          node scripts/lib/ci-cache-seed.mjs
      - name: Build affected crates and their prerequisites
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          CARGO_SHARD: ${{ matrix.shard }}
          CARGO_SHARD_COUNT: 4
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          node scripts/lib/ci-affected-builds.mjs run-cargo
      - name: Build the affected Bitwarden bridge feature
        if: matrix.shard == 0 && steps.affected.outputs.bitwarden == 'true'
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          cargo build --locked -p opensesame-gateway -p opensesame-cli --features bitwarden-compat

  typescript:
    # Preserve the existing protected-check names and candidate admission API.
    name: TypeScript
    needs: [changes, typescript-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Report the required build check
        env:
          DRAFT: ${{ needs.changes.outputs.draft }}
          PREFLIGHT_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.typescript }}
          SUITE_RESULT: ${{ needs.typescript-build.result }}
        run: node scripts/lib/ci-required-result.mjs

  bundle-check:
    # Legacy name: reports the TS build; actual budget checks qualify delivery.
    # Preserve the existing protected-check names and candidate admission API.
    name: Bundle budgets
    needs: [changes, typescript-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Report the required build check
        env:
          DRAFT: ${{ needs.changes.outputs.draft }}
          PREFLIGHT_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.typescript }}
          SUITE_RESULT: ${{ needs.typescript-build.result }}
        run: node scripts/lib/ci-required-result.mjs

  rust-check:
    # Preserve the existing protected-check names and candidate admission API.
    name: Rust
    needs: [changes, rust-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Report the required build check
        env:
          DRAFT: ${{ needs.changes.outputs.draft }}
          PREFLIGHT_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.rust }}
          SUITE_RESULT: ${{ needs.rust-build.result }}
        run: node scripts/lib/ci-required-result.mjs

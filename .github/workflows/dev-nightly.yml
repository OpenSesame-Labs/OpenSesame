# Immutable candidate promotion; schedules qualify one selected source snapshot.
name: Nightly dev qualification

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  attestations: read

concurrency:
  group: candidate-dev
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      source_ci_run_id: ${{ steps.select.outputs.source_ci_run_id }}
      source_ci_run_attempt: ${{ steps.select.outputs.source_ci_run_attempt }}
      reuse: ${{ steps.select.outputs.reuse }}
      candidate_id: ${{ steps.select.outputs.candidate_id }}
      run_id: ${{ steps.select.outputs.run_id }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      payload_digest: ${{ steps.select.outputs.payload_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node
      - name: Require implemented and activated promotion policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/candidate.mjs policy --controller dev-nightly
      - name: Freeze one integration source and optional complete artifact
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dev-selection"
          node scripts/release/candidate.mjs select-integration \
            --workflow .github/workflows/ci.yml \
            --reuse-complete \
            --selection-file "$RUNNER_TEMP/dev-selection/selection.json" \
            --output "$GITHUB_OUTPUT"
      - name: Retain this attempt's immutable selection record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-selection/selection.json
          if-no-files-found: error
          retention-days: 35

  result:
    name: Nightly selection result
    needs: [select]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful selection
        run: test "${{ needs.select.result }}" = success

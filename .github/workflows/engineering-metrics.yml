# Weekly engineering system metrics: quality, velocity, developer happiness and
# business outcomes, with the CI and review-flow companions that explain them.
#
# The report is the job summary and a JSON artifact. Nothing is committed and
# nothing gates a merge. Definitions and what each number is paired with:
# docs/contributing/engineering-system-metrics.md
#
# The pull_request trigger is a self-test: it runs the collector against live
# data whenever the collector, its definitions or this file change. The token
# is read-only on every event.

name: Engineering system metrics

on:
  schedule:
    # Mondays 13:37 UTC, off the hour to spread GitHub load.
    - cron: "37 13 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/metrics/**"
      - "scripts/lib/engineering-metrics*.mjs"
      - "scripts/lib/agent-commit-attribution.mjs"
      - "tools/metrics/**"
      - ".github/workflows/engineering-metrics.yml"

permissions: {}

concurrency:
  group: engineering-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Engineering system metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      deployments: read
      security-events: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/metrics
            tools/metrics
            tools/quality/quality-baseline.json
            /mise.toml
            /mise.lock
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: true
          install_args: node
      - name: Collect and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/metrics/engineering-system-metrics.mjs
          --out "$RUNNER_TEMP/engineering-system-metrics.json"
      - name: Keep the report as a run artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-system-metrics
          path: ${{ runner.temp }}/engineering-system-metrics.json
          retention-days: 90
          if-no-files-found: warn

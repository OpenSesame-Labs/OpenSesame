# Scheduled supply-chain scanning that complements the required merge checks.
#
# Nothing in this file gates a merge. The deterministic audit gates
# (`pnpm audit:osv`, `audit:cargo-audit`, `audit:cve-lite`, `audit:gitleaks`,
# `audit:semgrep`, `audit:ast-grep`, …) remain local scripts and git hooks —
# see AGENTS.md §6/§8 and docs/security/tooling-evaluation.md. This workflow
# keeps package-level source audits and dashboard checks visible on a schedule,
# where a hidden red is visible without a local checkout:
#
#   - TURN cryptography and the actual source-composed native JS/WASM import
#     graph, including their selected Go standard libraries
#   - OSV-Scanner over every lockfile (same engine as `pnpm audit:osv`;
#     unresolved advisories remain visible, with no configured exceptions)
#   - Patched dependency tarballs, rebuilt from the registry and compared
#     (`npm run patches:verify`; each must equal upstream plus its patch)
#   - gitleaks over full history (same engine as `pnpm audit:gitleaks` and
#     the pre-commit hook; .gitleaks.toml carries the allowlists)
#   - OSV-Scanner over every layer of each container image built from the
#     current source, exactly as the image proof workflow builds it, and of
#     each historical published image while its tag still exists (the
#     operating-system packages and bundled dependencies the lockfile scan
#     cannot see; findings go to the code-scanning dashboard)
#   - Betterleaks over the working tree and full history (`npm run
#     audit:betterleaks`; .betterleaks.toml extends .gitleaks.toml and carries
#     the exemptions for the generic-password and generic-credential-uri rules)
#   - npm registry signatures and provenance attestations over the locked tree
#     (`npm audit signatures`)
#   - Tailscale key material (`node scripts/security/tailscale-key-material-gate.mjs`)
#   - On a manual run only: the historical `next` and `latest` GHCR versions,
#     listed (`dry-run`, the default) or deleted (`delete`) so the published
#     image rows close their findings (docs/operators/ghcr-images.md)
#   - OpenSSF Scorecard (checks the repo against the OpenSSF supply-chain
#     criteria and publishes the score to the code-scanning dashboard and
#     the badge on the README)
#   - Repository settings (rulesets, deployment environments, visibility and
#     archive state): recorded each run, and the run fails when one changed
#     since the previous record

name: Repository security monitoring

on:
  schedule:
    # Mondays 05:23 UTC, off the hour to spread GitHub load.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Historical GHCR tags: dry-run lists the versions; delete removes them"
        type: choice
        options:
          - dry-run
          - delete
        default: dry-run

permissions: {}

concurrency:
  group: security-scanning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-go:
    name: Native JS/WASM source graph and Go advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: node
      - name: Install the locked audit runtime
        run: npm ci --ignore-scripts
      - name: Scan the composed production import graph and selected standard library
        # The helper owns a fresh private temporary directory. Success does not
        # check audit output into the repository or upload it as a public artifact.
        # Only a failed run uploads redacted logs.
        env:
          OPENSESAME_AUDIT_DIR: ${{ runner.temp }}/opensesame-native-audit
        run: node tools/pwa-tailscale-native-http/native-audit.mjs
      - name: Retain redacted native audit failure logs
        if: ${{ failure() && !cancelled() }}
        env:
          OPENSESAME_AUDIT_DIR: ${{ runner.temp }}/opensesame-native-audit
          NATIVE_AUDIT_FAILURE_LOGS: ${{ runner.temp }}/native-audit-failure-logs
        run: |
          node --input-type=module <<'EOF'
          import { mkdir, readdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          import { redactPreparationLog } from "./tools/pwa-tailscale-native-http/preparation-diagnostics.mjs";
          const root = process.env.OPENSESAME_AUDIT_DIR;
          const out = process.env.NATIVE_AUDIT_FAILURE_LOGS;
          await mkdir(out, { recursive: true, mode: 0o700 });
          let names = [];
          try {
            names = await readdir(join(root, "native-go/work"));
          } catch {
            names = [];
          }
          const files = [
            "audit.log",
            "native-preparation-native-audit-failure.json",
          ];
          let wrote = 0;
          for (const name of names) {
            if (!/^[0-9a-f-]{36}$/.test(name)) continue;
            for (const file of files) {
              try {
                const text = await readFile(
                  join(root, "native-go/work", name, file),
                  "utf8",
                );
                await writeFile(
                  join(out, `${name}-${file}`),
                  redactPreparationLog(text),
                  { mode: 0o600 },
                );
                wrote += 1;
              } catch {
                // A missing receipt or log is skipped; the scan failure remains.
              }
            }
          }
          if (!wrote)
            await writeFile(
              join(out, "no-owned-audit-log.txt"),
              "No retained native audit log was available to redact.\n",
              { mode: 0o600 },
            );
          EOF
      - name: Upload redacted native audit failure logs
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-audit-failure-logs
          path: ${{ runner.temp }}/native-audit-failure-logs
          retention-days: 5
          if-no-files-found: ignore

  turn-crypto:
    name: TURN cryptography source and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: go
      - name: Verify upstream source and scan all imported packages
        run: bash scripts/test/live-turn/audit-crypto.sh

  patched-dependencies:
    name: Patched dependency tarballs equal upstream plus patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: node
      # patched-dependencies.mjs imports tar from the locked tree.
      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The lockfile pins each tarball under patches/vendor/ by integrity, so
      # an install cannot be handed different bytes. This proves the other
      # half: the committed bytes are the published package plus the reviewed
      # patch and nothing else. It downloads each published package, refuses
      # it unless it matches the recorded upstream integrity, applies the
      # patch and compares every file. Nothing from a package is executed.
      - name: Rebuild each tarball from the registry and compare
        run: |
          node scripts/security/patched-dependencies.mjs verify
          python3 scripts/security/verify-vendored-sqlx.py
          python3 scripts/security/test_vendored_sqlx.py
          python3 scripts/security/verify-vendored-keepass.py
          python3 scripts/security/test_vendored_keepass.py
          python3 scripts/security/test_cargo_lock_projection.py
          python3 -I scripts/security/test_cargo_workspace_multipackage.py
          python3 -I scripts/security/test_spiffe_lock_drift.py

  osv-scanner:
    name: OSV-Scanner (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Scan every lockfile against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          # osv-scanner 2.x auto-discovers osv-scanner.toml at the scan root.
          # Keep this scheduled scan consistent with the local no-exception gate.
          scan-args: |-
            --output=osv-results.json
            --format=json
            --recursive
            ./
        continue-on-error: true
      - name: Convert results to SARIF
        uses: google/osv-scanner-action/osv-reporter-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --output=osv-results.sarif
            --fail-on-vuln=false
            --new=osv-results.json
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: osv-results.sarif

  # Publication is disabled, so the `next` and `latest` versions below are
  # historical. A hand-started run lists them (`dry-run`) or deletes them
  # (`delete`) before the scan, so a deleted tag closes its findings in the
  # same run. Only versions tagged `next` or `latest` are touched; a package,
  # an untagged or otherwise-tagged version and a package's last version are
  # never deleted (scripts/security/ghcr-historical-cleanup.mjs).
  historical-tags:
    name: Historical GHCR tags
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Deleting a version also needs this repository to hold the Admin role
      # on each package ("Manage Actions access"); a 403 names the package.
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The script imports scripts/lib/json-boundary.mjs.
          sparse-checkout: |
            scripts/security
            scripts/lib
      - name: Select and remove the historical versions
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: node scripts/security/ghcr-historical-cleanup.mjs

  container-images:
    name: Published image (${{ matrix.target.image }}:${{ matrix.tag }}, ${{ matrix.target.arch }})
    # After a hand-started cleanup, so a deleted tag is reported as gone. The
    # scheduled run skips the cleanup and scans as before; a failed cleanup
    # still scans whatever remains.
    needs: [historical-tags]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Scan both historical tags even while publication is disabled
        # (docs/operators/ghcr-images.md).
        tag: [next, latest]
        # Every image and platform covered by the container proof workflow.
        # A test keeps the two lists equal.
        target:
          - { image: opensesame, arch: amd64 }
          - { image: cli, arch: amd64 }
          - { image: cli, arch: arm64 }
          - { image: web-pwa, arch: amd64 }
          - { image: control-plane, arch: amd64 }
          - { image: control-plane, arch: arm64 }
    env:
      IMAGE: ghcr.io/opensesame-labs/${{ matrix.target.image }}
      TAG: ${{ matrix.tag }}
      ARCH: ${{ matrix.target.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/security
      # The lockfile scan sees what the repository pins. It cannot see the
      # base image's operating-system packages or what a build copies in. This
      # scans the bytes that were actually published. The image is pulled and
      # saved by the digest of the platform named; nothing in it is run.
      - name: Pull the published image and save it for the scanner
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          # Publication is disabled, so `next` and `latest` are historical and
          # are removed, not updated (docs/operators/ghcr-images.md). A tag the
          # registry reports as an unknown manifest no longer exists: there is
          # nothing to scan, and an empty report closes its earlier findings
          # below. That applies to either tag. Any other error fails.
          if ! listing="$(docker manifest inspect "$IMAGE:$TAG" 2>&1)"; then
            if grep -Eqi 'manifest unknown|no such manifest' <<<"$listing"; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$listing" >&2
            exit 1
          fi
          # The tag names a list of platform images. Take this platform's own
          # digest, so exactly that image is pulled, saved and reported.
          digest="$(jq -r --arg arch "$ARCH" '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | first // empty' <<<"$listing")"
          if [ -z "$digest" ]; then
            echo "::error::$IMAGE:$TAG publishes no linux/$ARCH image"
            exit 1
          fi
          docker pull --quiet "$IMAGE@$digest"
          docker save --output image.tar "$IMAGE@$digest"
          echo "published=true" >> "$GITHUB_OUTPUT"
          printf 'Scanned image: `%s` (`%s`, linux/%s)\n\n' "$IMAGE@$digest" "$TAG" "$ARCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan every layer against the OSV database
        if: steps.pull.outputs.published == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            scan
            image
            --archive
            --format=sarif
            --output-file=image.sarif
            image.tar
        # Exit 1 means advisories were found. They are reported below, not
        # hidden: a base image always carries some, and a permanently red job
        # is one nobody reads. A scanner that did not run fails the next step.
        continue-on-error: true
      # The artifact is gone, so its findings are gone with it. An empty
      # OSV-Scanner report in the same category closes them as fixed.
      - name: Report a deleted tag as carrying no findings
        if: steps.pull.outputs.published == 'false'
        run: |
          node scripts/security/empty-sarif.mjs image.sarif
          printf '`%s:%s` no longer exists in the registry: an empty report closes its earlier findings.\n\n' "$IMAGE" "$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Require a complete report and summarize it
        run: node scripts/security/sarif-summary.mjs image.sarif >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: image.sarif
          category: container-image-${{ matrix.target.image }}-${{ matrix.tag }}-${{ matrix.target.arch }}

  # The historical tags above are artifacts the repository no longer updates.
  # These jobs scan what the current source builds instead: every image the
  # proof workflow (.github/workflows/cd-ghcr-publish.yml) builds, built the
  # same way, with the same inputs. A test keeps the two in step. Nothing is
  # pushed and nothing in an image is run.
  #
  # The two inputs the proof prepares outside Docker are prepared here by the
  # same steps, except that the toolchain comes from mise-action like every
  # other job in this workflow. The proof's caches are read, never written.
  container-sources-web-pwa-tailscale-wasm:
    name: Source image input (web-pwa Tailscale WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the source
      actions: read # restore the proof's caches; none of them is saved
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit this run reports as scanned; otherwise the proof's checkout.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            tools
            scripts
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /patches/vendor
      # The pinned toolchain, installed the way every job here installs it.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: node
      - run: npm ci --ignore-scripts
      - name: Prepare pinned Tailscale native distributions
        run: node --input-type=module -e 'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  container-sources-opensesame-amd64-rust:
    name: Source image input (opensesame amd64 binary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the source
      actions: read # restore the proof's caches; none of them is saved
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit this run reports as scanned; otherwise the proof's checkout.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
            /.cargo/config.toml
      - name: Install Linux keychain build dependencies
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - name: Install musl toolchain
        run: bash scripts/ci/prepare-musl.sh "$RUNNER_TEMP/opensesame-musl"
      # The pinned toolchain, installed the way every job here installs it.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: rust
      # The proof's shared target cache, restored only: save-if is false on
      # every ref, so this run can never replace the blob the proof keeps.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache-ghcr
        with:
          prefix-key: v0-rust
          shared-key: ghcr-opensesame-amd64-musl
          cache-all-crates: true
          cache-on-failure: true
          save-if: false
          workspaces: . -> ../../../.cache/packages/cargo-target
      - name: Log Rust cache hit
        env:
          CACHE_NAME: rust-ghcr
          CACHE_HIT: ${{ steps.rust-cache-ghcr.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.rust-cache-ghcr.outputs.cache-primary-key }}
          CACHE_PRIMARY_KEY: v0-rust-ghcr-opensesame-amd64-musl
          CACHE_PRIMARY_IS_PREFIX: "true"
          MAIN_SEED_PREFIX: v0-rust-ghcr-opensesame-amd64-musl-
        run: |
          export CACHE_PROBE_DIR="${HOME}/.cargo/registry/cache"
          node scripts/lib/ci-cache-seed.mjs
      - name: Build opensesame release binary
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          source "$RUNNER_TEMP/opensesame-musl/env.sh"
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p opensesame-cli --bin opensesame --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensesame-amd64-binary
          path: ${{ env.CARGO_TARGET_DIR }}/x86_64-unknown-linux-musl/release/opensesame
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  container-sources:
    name: Source image (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [container-sources-web-pwa-tailscale-wasm, container-sources-opensesame-amd64-rust]
    # A failed input fails only the row that needs it (its download step);
    # every other image is still built and scanned.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the source
      actions: read # read the proof's layer cache; the build writes none
      security-events: write # upload the scan to code scanning
    strategy:
      fail-fast: false
      matrix:
        # One row per proof build: its id (the layer cache scope), Dockerfile,
        # target and runner. A test keeps this list equal to the proof's.
        include:
          - { id: opensesame-amd64, image: opensesame, file: ops/compose/Dockerfile, target: runtime-from-prebuilt, arch: amd64, runner: ubuntu-latest, extra-paths: "" }
          - { id: cli-amd64, image: cli, file: ops/containers/cli/Dockerfile, target: "", arch: amd64, runner: ubuntu-latest, extra-paths: "" }
          - { id: cli-arm64, image: cli, file: ops/containers/cli/Dockerfile, target: "", arch: arm64, runner: ubuntu-24.04-arm, extra-paths: "" }
          - { id: web-pwa-amd64, image: web-pwa, file: ops/containers/web-pwa/Dockerfile, target: runtime, arch: amd64, runner: ubuntu-latest, extra-paths: /.gitignore }
          - { id: control-plane-amd64, image: control-plane, file: ops/containers/control-plane/Dockerfile, target: "", arch: amd64, runner: ubuntu-latest, extra-paths: "" }
          - { id: control-plane-arm64, image: control-plane, file: ops/containers/control-plane/Dockerfile, target: "", arch: arm64, runner: ubuntu-24.04-arm, extra-paths: "" }
    steps:
      # The proof's checkout. web-pwa's proof also checks out /.gitignore; the
      # last line adds it for that row alone (an empty line is dropped).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit this run reports as scanned; otherwise the proof's checkout.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
            ${{ matrix.extra-paths }}
      - name: Restore prepared Tailscale WASM distributions
        if: matrix.image == 'web-pwa'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions
      - name: Download prebuilt opensesame binary
        if: matrix.image == 'opensesame'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opensesame-amd64-binary
          path: ops/compose/prebuilt
      - name: Check prebuilt opensesame binary
        if: matrix.image == 'opensesame'
        run: |
          set -euo pipefail
          test -f ops/compose/prebuilt/opensesame
          chmod 0755 ops/compose/prebuilt/opensesame
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The proof's build with its own cache scope, read only (no cache-to).
      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ matrix.image }}:local
          build-args: VERSION=0.0.0-local
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.id }}
      - name: Save the image for the scanner
        env:
          IMAGE: ${{ matrix.image }}:local
          DOCKERFILE: ${{ matrix.file }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker save --output image.tar "$IMAGE"
          printf 'Scanned image: `%s` built from `%s` at `%s` (linux/%s)\n\n' "$IMAGE" "$DOCKERFILE" "$GITHUB_SHA" "$ARCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan every layer against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            scan
            image
            --archive
            --format=sarif
            --output-file=image.sarif
            image.tar
        # As above: findings are reported, a scanner that did not run fails.
        continue-on-error: true
      - name: Require a complete report and summarize it
        run: node scripts/security/sarif-summary.mjs image.sarif >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: image.sarif
          category: container-source-${{ matrix.image }}-${{ matrix.arch }}

  devcontainer-image:
    name: Dev container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .devcontainer
            scripts/security
      # The dev container image is built on a developer's machine, not
      # published, so there is no registry copy to pull. This builds it from
      # the definition a developer would use and scans that. Nothing in the
      # image is run.
      - name: Build the dev container image and save it for the scanner
        run: |
          docker build --quiet --file .devcontainer/Dockerfile --tag opensesame-devcontainer:scan .devcontainer
          docker save --output image.tar opensesame-devcontainer:scan
      - name: Scan every layer against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            scan
            image
            --archive
            --format=sarif
            --output-file=image.sarif
            image.tar
        # As above: findings are reported, a scanner that did not run fails.
        continue-on-error: true
      - name: Require a complete report and summarize it
        run: node scripts/security/sarif-summary.mjs image.sarif >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: image.sarif
          category: container-image-devcontainer

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    # Walking the repository's full commit history takes longer than the
    # 20-minute default the other scans use; a timeout surfaces as a bare
    # "cancelled" job, which reads like interference rather than budget.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history so the scheduled pass sees what the pre-commit hook
          # (working tree only) cannot.
          fetch-depth: 0
          filter: blob:none
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # 8.24.x (the action's default) predates plural [[allowlists]], which
          # .gitleaks.toml uses for every global exclusion; 8.30.1 parses it.
          GITLEAKS_VERSION: "8.30.1"
          # This job runs on a schedule or by hand; it needs no PR write access.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Org repositories require a license; the secret is configured on the repo.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  betterleaks:
    name: betterleaks (working tree and full history)
    runs-on: ubuntu-latest
    # A blobless full-history walk fetches blobs on demand, which is slower than
    # the 20-minute default the other scans use (same budget as the gitleaks job).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history so the scheduled pass sees what a working-tree scan
          # cannot. Blobless like every other full-history checkout
          # (scripts/lib/ci-blobless-checkout.test.mjs).
          fetch-depth: 0
          filter: blob:none
      # One pin for developers and CI: the version and per-platform SHA-256 live
      # in the installer, which refuses on a checksum mismatch.
      - name: Install the pinned Betterleaks
        run: bash scripts/dev/install-betterleaks.sh "$RUNNER_TEMP/bin"
      # Detection only. The gate never passes `--validation`, so no candidate
      # secret is sent to a provider API. Reports stay in a private directory
      # outside the checkout and are not uploaded.
      # History is enforced: a new finding on any ref turns this run red. The
      # working tree and every ref are clean at the time of writing; resolve a
      # finding (or add a reviewed, commit-bound fingerprint), do not unset this.
      - name: Scan
        env:
          OPENSESAME_AUDIT_DIR: ${{ runner.temp }}/betterleaks-audit
          OPENSESAME_BETTERLEAKS_HISTORY_FAIL: "1"
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash scripts/audit/betterleaks-gate.sh

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard refuses every ref but the default branch, so a run started by
    # hand on another branch skips it instead of failing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run the OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to the public Scorecard dashboard so the README badge and
          # the scorecard.dev viewer work; this repository is public.
          publish_results: true
      - name: Keep the raw results as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results.sarif
          path: scorecard-results.sarif
          retention-days: 5
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: scorecard-results.sarif

  npm-signatures:
    name: npm registry signatures and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: node
      - name: Install the locked tree without lifecycle scripts
        run: npm ci --ignore-scripts
      # Every installed package must carry a valid registry signature, and
      # every provenance attestation a package publishes must verify. A
      # tampered tarball or a forged attestation turns this run red.
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures

  repository-records:
    name: Repository records export and clone check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/security
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: node
      # A clone holds the source and its history. Issues, pull requests and
      # review discussion live only on GitHub, so they are exported and kept.
      - name: Export issues, pull requests, their comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security/repository-records.mjs export "$RUNNER_TEMP/records" | tee -a "$GITHUB_STEP_SUMMARY"
      # The recovery rehearsal for the source: a fresh, complete clone must
      # pass an object check and hold the commit this run was started for.
      - name: Prove the source can be recovered from a fresh full clone
        run: |
          git clone --mirror --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/mirror.git"
          git -C "$RUNNER_TEMP/mirror.git" fsck --no-dangling
          git -C "$RUNNER_TEMP/mirror.git" merge-base --is-ancestor "$GITHUB_SHA" "refs/heads/$GITHUB_REF_NAME"
          printf 'A fresh full clone passed its object check and holds `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the exported records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-records
          path: ${{ runner.temp }}/records
          retention-days: 90
          if-no-files-found: error

  tailscale-key-material:
    name: Tailscale key material gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Reject committed Tailscale key material
        run: node scripts/security/tailscale-key-material-gate.mjs

  repository-settings:
    name: Repository settings changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/security
            scripts/lib
            ops/github
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install_args: node
      # The audit log cannot be streamed or queried from here, so nothing
      # raised an alert when a ruleset was disabled, a deployment environment
      # lost its reviewer, or the repository was archived. This records what
      # a read-only token can see of those settings and fails when one
      # changed. It reads; it never writes a setting.
      - name: Record the settings this token can read
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security/settings-snapshot.mjs collect "$RUNNER_TEMP/settings/repository-settings.json"
      - name: Report live rulesets that differ from the declared policy
        run: |
          set -o pipefail
          node scripts/security/settings-snapshot.mjs declared \
            "$RUNNER_TEMP/settings/repository-settings.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only a record uploaded by this workflow's own scheduled run on this
      # branch is used: any other run, a fork's pull request included, can
      # upload an artifact under the same name, and a hand-started run could
      # otherwise make a changed setting the new baseline.
      - name: Fetch the previous record from this branch
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security/settings-snapshot.mjs previous "$RUNNER_TEMP/settings-previous" >> "$GITHUB_OUTPUT"
      # Kept before the comparison, so a change raises one alarm and the next
      # run starts from the new state.
      - name: Keep this record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-settings
          path: ${{ runner.temp }}/settings/repository-settings.json
          retention-days: 90
          if-no-files-found: error
      - name: Fail when a setting changed since the previous record
        if: steps.previous.outputs.found == 'true'
        run: |
          set -o pipefail
          node scripts/security/settings-snapshot.mjs compare \
            "$RUNNER_TEMP/settings-previous/repository-settings.json" \
            "$RUNNER_TEMP/settings/repository-settings.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # A section that cannot be read compares equal to itself every week, so
      # it is a failure on its own, whether or not a change was found.
      - name: Fail when a section could not be read
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/security/settings-snapshot.mjs readable \
            "$RUNNER_TEMP/settings/repository-settings.json" | tee -a "$GITHUB_STEP_SUMMARY"

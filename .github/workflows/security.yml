# Scheduled supply-chain scanning that complements the required merge checks.
#
# Nothing in this file gates a merge. The deterministic audit gates
# (`pnpm audit:osv`, `audit:cargo-audit`, `audit:cve-lite`, `audit:gitleaks`,
# `audit:semgrep`, `audit:ast-grep`, …) remain local scripts and git hooks —
# see AGENTS.md §6/§8 and docs/security/tooling-evaluation.md. This workflow
# keeps package-level source audits and dashboard checks visible on a schedule,
# where a hidden red is visible without a local checkout:
#
#   - TURN cryptography and the actual source-composed native JS/WASM import
#     graph, including their selected Go standard libraries
#   - OSV-Scanner over every lockfile (same engine as `pnpm audit:osv`;
#     unresolved advisories remain visible, with no configured exceptions)
#   - Patched dependency tarballs, rebuilt from the registry and compared
#     (`npm run patches:verify`; each must equal upstream plus its patch)
#   - gitleaks over full history (same engine as `pnpm audit:gitleaks` and
#     the pre-commit hook; .gitleaks.toml carries the allowlists)
#   - OSV-Scanner over every layer of each published container image (the
#     operating-system packages and bundled dependencies the lockfile scan
#     cannot see; findings go to the code-scanning dashboard)
#   - Betterleaks over the working tree and full history (`npm run
#     audit:betterleaks`; .betterleaks.toml extends .gitleaks.toml and carries
#     the exemptions for the generic-password and generic-credential-uri rules)
#   - npm registry signatures and provenance attestations over the locked tree
#     (`npm audit signatures`)
#   - Tailscale key material (`node scripts/security/tailscale-key-material-gate.mjs`)
#   - OpenSSF Scorecard (checks the repo against the OpenSSF supply-chain
#     criteria and publishes the score to the code-scanning dashboard and
#     the badge on the README)
#   - Repository settings (rulesets, deployment environments, visibility and
#     archive state): recorded each run, and the run fails when one changed
#     since the previous record

name: Repository security monitoring

on:
  schedule:
    # Mondays 05:23 UTC, off the hour to spread GitHub load.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-scanning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-go:
    name: Native JS/WASM source graph and Go advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
          install_args: node
      - name: Install the locked audit runtime
        run: npm ci --ignore-scripts
      - name: Scan the composed production import graph and selected standard library
        # The helper owns a fresh private temporary directory. Success does not
        # check audit output into the repository or upload it as a public artifact.
        # Only a failed run uploads redacted logs.
        env:
          OPENSESAME_AUDIT_DIR: ${{ runner.temp }}/opensesame-native-audit
        run: node tools/pwa-tailscale-native-http/native-audit.mjs
      - name: Retain redacted native audit failure logs
        if: ${{ failure() && !cancelled() }}
        env:
          OPENSESAME_AUDIT_DIR: ${{ runner.temp }}/opensesame-native-audit
          NATIVE_AUDIT_FAILURE_LOGS: ${{ runner.temp }}/native-audit-failure-logs
        run: |
          node --input-type=module <<'EOF'
          import { mkdir, readdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          import { redactPreparationLog } from "./tools/pwa-tailscale-native-http/preparation-diagnostics.mjs";
          const root = process.env.OPENSESAME_AUDIT_DIR;
          const out = process.env.NATIVE_AUDIT_FAILURE_LOGS;
          await mkdir(out, { recursive: true, mode: 0o700 });
          let names = [];
          try {
            names = await readdir(join(root, "native-go/work"));
          } catch {
            names = [];
          }
          const files = [
            "audit.log",
            "native-preparation-native-audit-failure.json",
          ];
          let wrote = 0;
          for (const name of names) {
            if (!/^[0-9a-f-]{36}$/.test(name)) continue;
            for (const file of files) {
              try {
                const text = await readFile(
                  join(root, "native-go/work", name, file),
                  "utf8",
                );
                await writeFile(
                  join(out, `${name}-${file}`),
                  redactPreparationLog(text),
                  { mode: 0o600 },
                );
                wrote += 1;
              } catch {
                // A missing receipt or log is skipped; the scan failure remains.
              }
            }
          }
          if (!wrote)
            await writeFile(
              join(out, "no-owned-audit-log.txt"),
              "No retained native audit log was available to redact.\n",
              { mode: 0o600 },
            );
          EOF
      - name: Upload redacted native audit failure logs
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-audit-failure-logs
          path: ${{ runner.temp }}/native-audit-failure-logs
          retention-days: 5
          if-no-files-found: ignore

  turn-crypto:
    name: TURN cryptography source and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
          install_args: go
      - name: Verify upstream source and scan all imported packages
        run: bash scripts/test/live-turn/audit-crypto.sh

  patched-dependencies:
    name: Patched dependency tarballs equal upstream plus patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
          install_args: node
      # The lockfile pins each tarball under patches/vendor/ by integrity, so
      # an install cannot be handed different bytes. This proves the other
      # half: the committed bytes are the published package plus the reviewed
      # patch and nothing else. It downloads each published package, refuses
      # it unless it matches the recorded upstream integrity, applies the
      # patch and compares every file. Nothing from a package is executed.
      - name: Rebuild each tarball from the registry and compare
        run: node scripts/security/patched-dependencies.mjs verify

  osv-scanner:
    name: OSV-Scanner (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Scan every lockfile against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # osv-scanner 2.x auto-discovers osv-scanner.toml at the scan root.
          # Keep this scheduled scan consistent with the local no-exception gate.
          scan-args: |-
            --output=osv-results.json
            --format=json
            --recursive
            ./
        continue-on-error: true
      - name: Convert results to SARIF
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --fail-on-vuln=false
            --new=osv-results.json
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: osv-results.sarif

  container-images:
    name: Published image (${{ matrix.target.image }}:${{ matrix.tag }}, ${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Both moving tags: `next` is replaced by every push to main and
        # `latest` by every release tag (docs/operators/ghcr-images.md).
        tag: [next, latest]
        # Every image and platform the manifest job of cd-ghcr-publish.yml
        # publishes. A test keeps the two lists equal.
        target:
          - { image: opensesame, arch: amd64 }
          - { image: cli, arch: amd64 }
          - { image: cli, arch: arm64 }
          - { image: web-pwa, arch: amd64 }
          - { image: control-plane, arch: amd64 }
          - { image: control-plane, arch: arm64 }
    env:
      IMAGE: ghcr.io/opensesame-labs/${{ matrix.target.image }}
      TAG: ${{ matrix.tag }}
      ARCH: ${{ matrix.target.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/security
      # The lockfile scan sees what the repository pins. It cannot see the
      # base image's operating-system packages or what a build copies in. This
      # scans the bytes that were actually published. The image is pulled and
      # saved by the digest of the platform named; nothing in it is run.
      - name: Pull the published image and save it for the scanner
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          # `latest` exists only once a release tag has been published. Its
          # absence, which the registry reports as an unknown manifest, is
          # stated, not failed; any other error fails. A missing `next` fails:
          # every push to main publishes it.
          if ! listing="$(docker manifest inspect "$IMAGE:$TAG" 2>&1)"; then
            if [ "$TAG" = latest ] && grep -Eqi 'manifest unknown|no such manifest' <<<"$listing"; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              printf 'No release has published `%s` yet: nothing to scan.\n' "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '%s\n' "$listing" >&2
            exit 1
          fi
          # The tag names a list of platform images. Take this platform's own
          # digest, so exactly that image is pulled, saved and reported.
          digest="$(jq -r --arg arch "$ARCH" '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | first // empty' <<<"$listing")"
          if [ -z "$digest" ]; then
            echo "::error::$IMAGE:$TAG publishes no linux/$ARCH image"
            exit 1
          fi
          docker pull --quiet "$IMAGE@$digest"
          docker save --output image.tar "$IMAGE@$digest"
          echo "published=true" >> "$GITHUB_OUTPUT"
          printf 'Scanned image: `%s` (`%s`, linux/%s)\n\n' "$IMAGE@$digest" "$TAG" "$ARCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan every layer against the OSV database
        if: steps.pull.outputs.published == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            image
            --archive
            --format=sarif
            --output-file=image.sarif
            image.tar
        # Exit 1 means advisories were found. They are reported below, not
        # hidden: a base image always carries some, and a permanently red job
        # is one nobody reads. A scanner that did not run fails the next step.
        continue-on-error: true
      - name: Require a complete report and summarize it
        if: steps.pull.outputs.published == 'true'
        run: node scripts/security/sarif-summary.mjs image.sarif >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the code-scanning dashboard
        if: steps.pull.outputs.published == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: image.sarif
          category: container-image-${{ matrix.target.image }}-${{ matrix.tag }}-${{ matrix.target.arch }}

  devcontainer-image:
    name: Dev container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .devcontainer
            scripts/security
      # The dev container image is built on a developer's machine, not
      # published, so there is no registry copy to pull. This builds it from
      # the definition a developer would use and scans that. Nothing in the
      # image is run.
      - name: Build the dev container image and save it for the scanner
        run: |
          docker build --quiet --file .devcontainer/Dockerfile --tag opensesame-devcontainer:scan .devcontainer
          docker save --output image.tar opensesame-devcontainer:scan
      - name: Scan every layer against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            image
            --archive
            --format=sarif
            --output-file=image.sarif
            image.tar
        # As above: findings are reported, a scanner that did not run fails.
        continue-on-error: true
      - name: Require a complete report and summarize it
        run: node scripts/security/sarif-summary.mjs image.sarif >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: image.sarif
          category: container-image-devcontainer

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    # Walking the repository's full commit history takes longer than the
    # 20-minute default the other scans use; a timeout surfaces as a bare
    # "cancelled" job, which reads like interference rather than budget.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history so the scheduled pass sees what the pre-commit hook
          # (working tree only) cannot.
          fetch-depth: 0
          filter: blob:none
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # 8.24.x (the action's default) predates plural [[allowlists]], which
          # .gitleaks.toml uses for every global exclusion; 8.30.1 parses it.
          GITLEAKS_VERSION: "8.30.1"
          # This job runs on a schedule or by hand; it needs no PR write access.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Org repositories require a license; the secret is configured on the repo.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  betterleaks:
    name: betterleaks (working tree and full history)
    runs-on: ubuntu-latest
    # A blobless full-history walk fetches blobs on demand, which is slower than
    # the 20-minute default the other scans use (same budget as the gitleaks job).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history so the scheduled pass sees what a working-tree scan
          # cannot. Blobless like every other full-history checkout
          # (scripts/lib/ci-blobless-checkout.test.mjs).
          fetch-depth: 0
          filter: blob:none
      # One pin for developers and CI: the version and per-platform SHA-256 live
      # in the installer, which refuses on a checksum mismatch.
      - name: Install the pinned Betterleaks
        run: bash scripts/dev/install-betterleaks.sh "$RUNNER_TEMP/bin"
      # Detection only. The gate never passes `--validation`, so no candidate
      # secret is sent to a provider API. Reports stay in a private directory
      # outside the checkout and are not uploaded.
      # History is enforced: a new finding on any ref turns this run red. The
      # working tree and every ref are clean at the time of writing; resolve a
      # finding (or add a reviewed, commit-bound fingerprint), do not unset this.
      - name: Scan
        env:
          OPENSESAME_AUDIT_DIR: ${{ runner.temp }}/betterleaks-audit
          OPENSESAME_BETTERLEAKS_HISTORY_FAIL: "1"
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash scripts/audit/betterleaks-gate.sh

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard refuses every ref but the default branch, so a run started by
    # hand on another branch skips it instead of failing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run the OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to the public Scorecard dashboard so the README badge and
          # the scorecard.dev viewer work; this repository is public.
          publish_results: true
      - name: Keep the raw results as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results.sarif
          path: scorecard-results.sarif
          retention-days: 5
      - name: Upload to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: scorecard-results.sarif

  npm-signatures:
    name: npm registry signatures and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
          install_args: node
      - name: Install the locked tree without lifecycle scripts
        run: npm ci --ignore-scripts
      # Every installed package must carry a valid registry signature, and
      # every provenance attestation a package publishes must verify. A
      # tampered tarball or a forged attestation turns this run red.
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures

  repository-records:
    name: Repository records export and clone check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/security
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
          install_args: node
      # A clone holds the source and its history. Issues, pull requests and
      # review discussion live only on GitHub, so they are exported and kept.
      - name: Export issues, pull requests, their comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security/repository-records.mjs export "$RUNNER_TEMP/records" | tee -a "$GITHUB_STEP_SUMMARY"
      # The recovery rehearsal for the source: a fresh, complete clone must
      # pass an object check and hold the commit this run was started for.
      - name: Prove the source can be recovered from a fresh full clone
        run: |
          git clone --mirror --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/mirror.git"
          git -C "$RUNNER_TEMP/mirror.git" fsck --no-dangling
          git -C "$RUNNER_TEMP/mirror.git" merge-base --is-ancestor "$GITHUB_SHA" "refs/heads/$GITHUB_REF_NAME"
          printf 'A fresh full clone passed its object check and holds `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the exported records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-records
          path: ${{ runner.temp }}/records
          retention-days: 90
          if-no-files-found: error

  tailscale-key-material:
    name: Tailscale key material gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Reject committed Tailscale key material
        run: node scripts/security/tailscale-key-material-gate.mjs

  repository-settings:
    name: Repository settings changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/security
            scripts/lib
            ops/github
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: true
          install_args: node
      # The audit log cannot be streamed or queried from here, so nothing
      # raised an alert when a ruleset was disabled, a deployment environment
      # lost its reviewer, or the repository was archived. This records what
      # a read-only token can see of those settings and fails when one
      # changed. It reads; it never writes a setting.
      - name: Record the settings this token can read
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security/settings-snapshot.mjs collect "$RUNNER_TEMP/settings/repository-settings.json"
      - name: Report live rulesets that differ from the declared policy
        run: |
          set -o pipefail
          node scripts/security/settings-snapshot.mjs declared \
            "$RUNNER_TEMP/settings/repository-settings.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # Only a record uploaded by this workflow's own scheduled run on this
      # branch is used: any other run, a fork's pull request included, can
      # upload an artifact under the same name, and a hand-started run could
      # otherwise make a changed setting the new baseline.
      - name: Fetch the previous record from this branch
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security/settings-snapshot.mjs previous "$RUNNER_TEMP/settings-previous" >> "$GITHUB_OUTPUT"
      # Kept before the comparison, so a change raises one alarm and the next
      # run starts from the new state.
      - name: Keep this record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-settings
          path: ${{ runner.temp }}/settings/repository-settings.json
          retention-days: 90
          if-no-files-found: error
      - name: Fail when a setting changed since the previous record
        if: steps.previous.outputs.found == 'true'
        run: |
          set -o pipefail
          node scripts/security/settings-snapshot.mjs compare \
            "$RUNNER_TEMP/settings-previous/repository-settings.json" \
            "$RUNNER_TEMP/settings/repository-settings.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # A section that cannot be read compares equal to itself every week, so
      # it is a failure on its own, whether or not a change was found.
      - name: Fail when a section could not be read
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/security/settings-snapshot.mjs readable \
            "$RUNNER_TEMP/settings/repository-settings.json" | tee -a "$GITHUB_STEP_SUMMARY"

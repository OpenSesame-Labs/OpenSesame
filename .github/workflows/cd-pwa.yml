# GitHub Pages PWA CD. One build, then automatic preview, then Production.
# Preview npm publish selects environment Preview (no required reviewers; NPM_TOKEN from that environment).
# Pages deploy stays on github-pages. Production publishes 0.0.0-next.N on next with NPM_TOKEN
# (OIDC when that token is empty).
name: CD PWA

on:
  push:
    branches: [main]
    paths:
      - "apps/pages/**"
      - "packages/app-core/**"
      - "packages/static-auth/**"
      - "scripts/release/plan-pages-release.mjs"
      - "scripts/release/plan-npm-cd-release.mjs"
      - "scripts/release/npm-prerelease-version.mjs"
      - "scripts/release/prepare-pages-release.mjs"
      - "scripts/release/npm-publish-names.mjs"
      - "scripts/release/pages-pwa-serve.mjs"
      - "scripts/release/cd-release-meta.mjs"
      - "scripts/release/cd-main-ci-gate.mjs"
      - "scripts/release/cd-preview-smoke.mjs"
      - "scripts/release/cd-registry-wait.mjs"
      - "scripts/release/cd-production-npm-version.mjs"
      - "scripts/release/cd-promotion-notify.mjs"
      - "scripts/ci/pwa-install-profile-proof.mjs"
      - "scripts/ci/pwa-profile-proof-assert.mjs"
      - "scripts/ci/pwa-profile-proof-gate.mjs"
      - "scripts/ci/pwa-profile-proof-select.mjs"
      - ".github/actions/publish-npm-package/**"
      - ".github/workflows/cd-pwa.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop after the build artifacts (before preview publish, Pages deploy, and Production).
        required: false
        type: boolean
        default: false
      proof_gate_fail:
        description: When true, preview smoke fails on purpose (live gate proof on main only).
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  attestations: write

# Queue overlapping main pushes so an in-flight Production promotion is not
# cancelled mid-environment (exact Preview artifact must still promote).
concurrency:
  group: cd-pwa
  cancel-in-progress: false

env:
  # Save primary install caches on main, merge_group, and workflow_dispatch of main.
  # Save the main seed only on push and workflow_dispatch of main.
  # Pull requests, including forks, restore and do not save.
  TRUSTED_CACHE_SAVE: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
  MAIN_CACHE_SEED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
  PAGES_CANONICAL_ORIGIN: ${{ vars.PAGES_CANONICAL_ORIGIN || 'https://opensesame-labs.github.io' }}
  PAGES_DEPLOYMENT_PROFILE: ${{ vars.PAGES_DEPLOYMENT_PROFILE || 'shared_origin_demo' }}
  PAGES_HEADER_SECURITY: ${{ vars.PAGES_HEADER_SECURITY || '0' }}
  VITE_BASE: ${{ vars.VITE_BASE || '/OpenSesame/' }}

jobs:
  main_ci:
    name: Main CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Require trunk CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_GATE_INTERVAL_MS: "10000"
        run: node scripts/release/cd-main-ci-gate.mjs

  proof:
    name: Build install profile (full)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PWA_PROFILE_PROOF_NAME: full
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-download-v2-${{ runner.os }}-seed-main-
      - name: Install the frozen dependency graph
        run: npm ci
      - name: Save npm download cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
      - name: Save npm main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-seed-main-${{ hashFiles('package-lock.json') }}
      - name: Log npm cache hit
        env:
          CACHE_NAME: npm
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.npm-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.npm-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: npm-download-v2-${{ runner.os }}-seed-main-
        run: node scripts/lib/ci-cache-seed.mjs
      - run: npx playwright install --with-deps chromium
      - name: Profile build and screenshot
        run: node scripts/ci/pwa-install-profile-proof.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-profile-proof-${{ github.run_id }}
          path: artifacts/pwa-profile-proof
          if-no-files-found: error

  build:
    # Overlaps main_ci gate and full install-profile proof. Preview and Pages deploy wait for all three.
    name: Build Pages and stage npm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm_dist_tag: ${{ steps.plan.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Plan version
        id: plan
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          node scripts/release/plan-pages-release.mjs --sha "$short" | tee /tmp/plan.txt
          version="$(sed -n 's/^version=//p' /tmp/plan.txt)"
          npm_dist_tag="$(sed -n 's/^npm_dist_tag=//p' /tmp/plan.txt)"
          test -n "$version"
          test -n "$npm_dist_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-download-v2-${{ runner.os }}-seed-main-
      - name: Install the frozen dependency graph
        run: npm ci
      - name: Save npm download cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
      - name: Save npm main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-seed-main-${{ hashFiles('package-lock.json') }}
      - name: Log npm cache hit
        env:
          CACHE_NAME: npm
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.npm-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.npm-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: npm-download-v2-${{ runner.os }}-seed-main-
        run: node scripts/lib/ci-cache-seed.mjs
      - name: Production Pages build
        env:
          PAGES_CANONICAL_ORIGIN: ${{ env.PAGES_CANONICAL_ORIGIN }}
          PAGES_DEPLOYMENT_PROFILE: ${{ env.PAGES_DEPLOYMENT_PROFILE }}
          PAGES_HEADER_SECURITY: ${{ env.PAGES_HEADER_SECURITY }}
          VITE_BASE: ${{ env.VITE_BASE }}
        run: npm run build -w @opensesame/pages
      - name: Stamp the Pages release
        run: node scripts/release/pages-release.mjs stamp apps/pages/dist "$GITHUB_SHA"
      - name: Stage npm publish tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/prepare-pages-release.mjs
      - name: npm publish dry-run
        working-directory: apps/pages/release
        env:
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: npm publish --dry-run --access public --tag "$NPM_DIST_TAG"
      - name: Record release metadata
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: node scripts/release/cd-release-meta.mjs write artifacts/cd-pwa-meta/release.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/pages/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-dist-${{ github.run_id }}
          path: apps/pages/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-pages-pwa-release-${{ github.run_id }}
          path: apps/pages/release
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cd-pwa-meta-${{ github.run_id }}
          path: artifacts/cd-pwa-meta
          if-no-files-found: error

  npm_preview:
    name: Preview npm publish
    needs: [main_ci, build, proof]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: Preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-pages-pwa-release-${{ github.run_id }}
          path: apps/pages/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-pwa-meta-${{ github.run_id }}
          path: artifacts/cd-pwa-meta
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Require the staged metadata
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/release/cd-release-meta.mjs check artifacts/cd-pwa-meta/release.json apps/pages/release/package.json
      # Preview environment supplies NPM_TOKEN (publish-npm-package → NODE_AUTH_TOKEN + .npmrc).
      # No required reviewers on Preview; otherwise OIDC trusted publishing under the same environment.
      - uses: ./.github/actions/publish-npm-package
        with:
          working-directory: apps/pages/release
          npm-dist-tag: ${{ needs.build.outputs.npm_dist_tag }}
          npm-token: ${{ secrets.NPM_TOKEN }}
      - name: Confirm web-pwa on the registry
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          SMOKE_PUBLISHED_PACKAGE: "@opensesame-labs/web-pwa"
        run: node scripts/release/cd-registry-wait.mjs

  deploy:
    name: Deploy GitHub Pages
    needs: [main_ci, build, proof]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4.0.5

  preview_smoke:
    name: Preview deploy smoke
    needs: [build, deploy, npm_preview]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts/release
            scripts/lib
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Prove alpha npm and live Pages for this revision
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          SMOKE_PUBLISHED_PACKAGE: "@opensesame-labs/web-pwa"
          CD_REGISTRY_VERSION_CONFIRMED: ${{ needs.npm_preview.result == 'success' && '1' || '' }}
          CD_PROOF_GATE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_gate_fail == true && '1' || '' }}
        run: node scripts/release/cd-preview-smoke.mjs

  production:
    name: Production promotion
    needs: [main_ci, proof, build, deploy, npm_preview, preview_smoke]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: Production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            scripts/release
            scripts/lib
            .github/actions/publish-npm-package
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pages-dist-${{ github.run_id }}
          path: apps/pages/dist
      - name: Require the staged Pages dist
        run: test -s apps/pages/dist/index.html
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-pages-pwa-release-${{ github.run_id }}
          path: apps/pages/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-pwa-meta-${{ github.run_id }}
          path: artifacts/cd-pwa-meta
      - name: Require the staged metadata
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/release/cd-release-meta.mjs check artifacts/cd-pwa-meta/release.json apps/pages/release/package.json
      - name: Verify live Pages release
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/release/pages-release.mjs verify "${{ env.PAGES_URL }}" "${{ github.sha }}"
      - name: Rewrite alpha version to 0.0.0-next.N
        run: node scripts/release/cd-production-npm-version.mjs rewrite apps/pages/release/package.json
      # Production environment secret NPM_TOKEN. Empty token keeps OIDC.
      # Same staged tarball, tag next, provenance. Never latest.
      - name: Publish 0.0.0-next.N on next
        uses: ./.github/actions/publish-npm-package
        with:
          working-directory: apps/pages/release
          npm-dist-tag: next
          npm-token: ${{ secrets.NPM_TOKEN }}

  promotion_failed:
    name: Promotion failure notice
    needs: [main_ci, proof, build, deploy, npm_preview, preview_smoke, production]
    if: failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Commit comments need contents: write. The issues permission does not cover them.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Annotate the run and comment on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_MAIN_CI: ${{ needs.main_ci.result }}
          GATE_PROOF: ${{ needs.proof.result }}
          GATE_BUILD: ${{ needs.build.result }}
          GATE_DEPLOY: ${{ needs.deploy.result }}
          GATE_NPM_PREVIEW: ${{ needs.npm_preview.result }}
          GATE_PREVIEW_SMOKE: ${{ needs.preview_smoke.result }}
          GATE_PRODUCTION: ${{ needs.production.result }}
        run: node scripts/release/cd-promotion-notify.mjs

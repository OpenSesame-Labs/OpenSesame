# GitHub Pages PWA CD. One build, then automatic preview, then Production.
# Preview npm publish selects environment Preview (no required reviewers; NPM_TOKEN from that environment).
# Pages deploy stays on github-pages. Production publishes 0.0.0-next.N on next with NPM_TOKEN
# (OIDC when that token is empty).
name: CD PWA

on:
  push:
    branches: [main]
    paths:
      - "apps/pages/**"
      - "packages/app-core/**"
      - "packages/static-auth/**"
      - "scripts/release/plan-pages-release.mjs"
      - "scripts/release/plan-npm-cd-release.mjs"
      - "scripts/release/npm-prerelease-version.mjs"
      - "scripts/release/prepare-pages-release.mjs"
      - "scripts/release/npm-publish-names.mjs"
      - "scripts/release/pages-pwa-serve.mjs"
      - "scripts/release/cd-release-meta.mjs"
      - "scripts/release/cd-main-ci-gate.mjs"
      - "scripts/release/cd-resolve-main-ci-run.mjs"
      - "scripts/release/cd-preview-smoke.mjs"
      - "scripts/release/cd-pwa-preview-smoke/**"
      - "scripts/release/cd-registry-wait.mjs"
      - "scripts/release/cd-production-npm-version.mjs"
      - "scripts/release/cd-promotion-notify.mjs"
      - "scripts/ci/pwa-install-profile-proof.mjs"
      - "scripts/ci/pwa-full-profile-dist-build.mjs"
      - "scripts/ci/ensure-chrome-headless-shell.mjs"
      - "scripts/ci/cd-pwa-pages-workspace-install.mjs"
      - "scripts/ci/cd-pwa-proof-sharp-install.mjs"
      - "scripts/ci/pwa-profile-proof-assert.mjs"
      - "scripts/ci/pwa-profile-proof-gate.mjs"
      - "scripts/ci/pwa-profile-proof-select.mjs"
      - ".github/actions/publish-npm-package/**"
      - ".github/workflows/cd-pwa.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop after the build artifacts (before preview publish, Pages deploy, and Production).
        required: false
        type: boolean
        default: false
      proof_gate_fail:
        description: When true, preview smoke fails on purpose (live gate proof on main only).
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  attestations: write

# Queue overlapping main pushes so an in-flight Production promotion is not
# cancelled mid-environment (exact Preview artifact must still promote).
concurrency:
  group: cd-pwa
  cancel-in-progress: false

env:
  # Save primary install caches on main, merge_group, and workflow_dispatch of main.
  # Save the main seed only on push and workflow_dispatch of main.
  # Pull requests, including forks, restore and do not save.
  TRUSTED_CACHE_SAVE: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
  MAIN_CACHE_SEED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
  PAGES_CANONICAL_ORIGIN: ${{ vars.PAGES_CANONICAL_ORIGIN || 'https://opensesame-labs.github.io' }}
  PAGES_DEPLOYMENT_PROFILE: ${{ vars.PAGES_DEPLOYMENT_PROFILE || 'shared_origin_demo' }}
  PAGES_HEADER_SECURITY: ${{ vars.PAGES_HEADER_SECURITY || '0' }}
  VITE_BASE: ${{ vars.VITE_BASE || '/OpenSesame/' }}

jobs:
  main_ci:
    name: Main CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/release
            /mise.toml
            /mise.lock
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Require trunk CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_GATE_INTERVAL_MS: "10000"
        run: node scripts/release/cd-main-ci-gate.mjs

  build_full_profile:
    name: Build full install profile dist
    needs: [main_ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Resolve main CI workflow run for artifact download
        id: main_ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/cd-resolve-main-ci-run.mjs
      - name: Reuse full install profile dist from main CI
        id: ci_full_profile_dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: ci-pwa-full-profile-dist-${{ steps.main_ci_run.outputs.run_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.main_ci_run.outputs.run_id }}
          path: apps/pages/dist-profiles/pwa-proof/full
      - name: Log CI full-profile dist promotion
        run: |
          if [ "${{ steps.ci_full_profile_dist.outcome }}" = "success" ]; then
            echo "Promoted ci-pwa-full-profile-dist from main CI run ${{ steps.main_ci_run.outputs.run_id }}"
          else
            echo "No CI full-profile artifact (compile locally)"
          fi
      - name: Restore mise cache
        if: steps.ci_full_profile_dist.outcome != 'success'
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        if: steps.ci_full_profile_dist.outcome != 'success'
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        if: steps.ci_full_profile_dist.outcome != 'success'
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true' && steps.ci_full_profile_dist.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true' && steps.ci_full_profile_dist.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Restore npm download cache
        if: steps.ci_full_profile_dist.outcome != 'success'
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-download-v2-${{ runner.os }}-seed-main-
      - name: Install Pages workspace dependencies
        if: steps.ci_full_profile_dist.outcome != 'success'
        run: node scripts/ci/cd-pwa-pages-workspace-install.mjs
      - name: Save npm download cache
        if: env.TRUSTED_CACHE_SAVE == 'true' && steps.ci_full_profile_dist.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
      - name: Save npm main seed
        if: env.MAIN_CACHE_SEED == 'true' && steps.ci_full_profile_dist.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-seed-main-${{ hashFiles('package-lock.json') }}
      - name: Log npm cache hit
        if: steps.ci_full_profile_dist.outcome != 'success'
        env:
          CACHE_NAME: npm
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.npm-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.npm-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: npm-download-v2-${{ runner.os }}-seed-main-
        run: node scripts/lib/ci-cache-seed.mjs
      - name: Prepare the local Turborepo cache key
        if: steps.ci_full_profile_dist.outcome != 'success'
        id: turbo_local_meta
        env:
          RUNNER_OS: ${{ runner.os }}
        run: node scripts/lib/ci-turbo-local-cache.mjs
      - name: Cache the local Turborepo task cache
        if: steps.ci_full_profile_dist.outcome != 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ steps.turbo_local_meta.outputs.turbo_local_cache_key }}
          restore-keys: |
            ${{ steps.turbo_local_meta.outputs.turbo_local_restore_prefix }}
      - name: Cache the pinned native PWA distribution
        if: steps.ci_full_profile_dist.outcome != 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Restore full install profile dist cache
        if: steps.ci_full_profile_dist.outcome != 'success'
        id: full-profile-dist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/pages/dist-profiles/pwa-proof/full
          key: pwa-full-profile-dist-${{ hashFiles('apps/pages/capability-profiles/full.json', 'apps/pages/package.json', 'package-lock.json', 'tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
          restore-keys: |
            pwa-full-profile-dist-
      - name: Compile full install profile dist
        if: steps.ci_full_profile_dist.outcome != 'success'
        env:
          VERIFY_SKIP_BUILD: ${{ steps.full-profile-dist-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: node scripts/ci/pwa-full-profile-dist-build.mjs
      - name: Save full install profile dist cache
        if: env.TRUSTED_CACHE_SAVE == 'true' && steps.ci_full_profile_dist.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/pages/dist-profiles/pwa-proof/full
          key: pwa-full-profile-dist-${{ hashFiles('apps/pages/capability-profiles/full.json', 'apps/pages/package.json', 'package-lock.json', 'tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-full-profile-dist-${{ github.run_id }}
          path: apps/pages/dist-profiles/pwa-proof/full
          if-no-files-found: error

  proof:
    name: Build install profile (full)
    needs: [build_full_profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PWA_PROFILE_PROOF_NAME: full
      PWA_PROFILE_PROOF_DIST: apps/pages/dist-profiles/pwa-proof/full
      VERIFY_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pwa-full-profile-dist-${{ github.run_id }}
          path: apps/pages/dist-profiles/pwa-proof/full
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-download-v2-${{ runner.os }}-seed-main-
      - name: Install Pages workspace dependencies
        run: node scripts/ci/cd-pwa-pages-workspace-install.mjs
      - name: Install sharp for install-profile proof gate
        run: node scripts/ci/cd-pwa-proof-sharp-install.mjs
      - name: Restore chrome-headless-shell cache
        id: chrome-shell-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cd-chrome-headless-shell
          key: cd-chrome-headless-shell-${{ runner.os }}-156.0.8078.4
          restore-keys: |
            cd-chrome-headless-shell-${{ runner.os }}-
      - name: Resolve headless Chromium for screenshots
        id: chrome_shell
        run: |
          set -euo pipefail
          path="$(node scripts/ci/ensure-chrome-headless-shell.mjs)"
          echo "PLAYWRIGHT_CHROMIUM=$path" >> "$GITHUB_ENV"
      - name: Save chrome-headless-shell cache
        if: steps.chrome-shell-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cd-chrome-headless-shell
          key: cd-chrome-headless-shell-${{ runner.os }}-156.0.8078.4
      - name: Full install profile screenshot
        run: node scripts/ci/pwa-install-profile-proof.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-profile-proof-${{ github.run_id }}
          path: artifacts/pwa-profile-proof
          if-no-files-found: error

  build:
    # Overlaps main_ci gate and build_full_profile. Preview waits for build, proof, and gate.
    name: Build Pages and stage npm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm_dist_tag: ${{ steps.plan.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise
          CACHE_HIT: ${{ steps.mise-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.mise-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.mise-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: mise-v2-${{ runner.os }}-seed-main-node-24-,mise-v1-linux-
        run: node scripts/lib/ci-cache-seed.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24
      - name: Save mise cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Save mise main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-seed-main-node-24-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Plan version
        id: plan
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          node scripts/release/plan-pages-release.mjs --sha "$short" | tee /tmp/plan.txt
          version="$(sed -n 's/^version=//p' /tmp/plan.txt)"
          npm_dist_tag="$(sed -n 's/^npm_dist_tag=//p' /tmp/plan.txt)"
          test -n "$version"
          test -n "$npm_dist_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-download-v2-${{ runner.os }}-seed-main-
      - name: Install the frozen dependency graph
        run: npm ci
      - name: Save npm download cache
        if: env.TRUSTED_CACHE_SAVE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
      - name: Save npm main seed
        if: env.MAIN_CACHE_SEED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-seed-main-${{ hashFiles('package-lock.json') }}
      - name: Log npm cache hit
        env:
          CACHE_NAME: npm
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.npm-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ steps.npm-cache.outputs.cache-primary-key }}
          MAIN_SEED_PREFIX: npm-download-v2-${{ runner.os }}-seed-main-
        run: node scripts/lib/ci-cache-seed.mjs
      - name: Prepare the local Turborepo cache key
        id: turbo_local_meta
        env:
          RUNNER_OS: ${{ runner.os }}
        run: node scripts/lib/ci-turbo-local-cache.mjs
      - name: Cache the local Turborepo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ steps.turbo_local_meta.outputs.turbo_local_cache_key }}
          restore-keys: |
            ${{ steps.turbo_local_meta.outputs.turbo_local_restore_prefix }}
      - name: Cache the pinned native PWA distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Production Pages build
        env:
          PAGES_CANONICAL_ORIGIN: ${{ env.PAGES_CANONICAL_ORIGIN }}
          PAGES_DEPLOYMENT_PROFILE: ${{ env.PAGES_DEPLOYMENT_PROFILE }}
          PAGES_HEADER_SECURITY: ${{ env.PAGES_HEADER_SECURITY }}
          VITE_BASE: ${{ env.VITE_BASE }}
        run: node scripts/lib/ci-pages-build.mjs
      - name: Stamp the Pages release
        run: node scripts/release/pages-release.mjs stamp apps/pages/dist "$GITHUB_SHA"
      - name: Stage npm publish tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/prepare-pages-release.mjs
      - name: npm publish dry-run
        working-directory: apps/pages/release
        env:
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: npm publish --dry-run --access public --tag "$NPM_DIST_TAG"
      - name: Record release metadata
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: node scripts/release/cd-release-meta.mjs write artifacts/cd-pwa-meta/release.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/pages/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-dist-${{ github.run_id }}
          path: apps/pages/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-pages-pwa-release-${{ github.run_id }}
          path: apps/pages/release
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cd-pwa-meta-${{ github.run_id }}
          path: artifacts/cd-pwa-meta
          if-no-files-found: error

  npm_preview:
    name: Preview npm publish
    needs: [main_ci, build, proof]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: Preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release
            scripts/lib
            .github/actions/publish-npm-package
            /mise.toml
            /mise.lock
            /package.json
            /package-lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-pages-pwa-release-${{ github.run_id }}
          path: apps/pages/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-pwa-meta-${{ github.run_id }}
          path: artifacts/cd-pwa-meta
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - name: Log mise cache hit
        env:
          CACHE_NAME: mise

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4.0.5

  preview_smoke:
    name: Preview deploy smoke
    needs: [main_ci, build, deploy, npm_preview]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release
            scripts/lib
            scripts/ci
            apps/pages/scripts/duress
            package.json
            /package-lock.json
            /mise.toml
            /mise.lock
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-download-v2-${{ runner.os }}-lock-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-download-v2-${{ runner.os }}-seed-main-
      - name: Restore chrome-headless-shell cache
        id: chrome-shell-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cd-chrome-headless-shell
          key: cd-chrome-headless-shell-${{ runner.os }}-156.0.8078.4
          restore-keys: |
            cd-chrome-headless-shell-${{ runner.os }}-
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-24-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-24-
            mise-v1-linux-
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          cache_save: false
          cache_key: mise-v1-nosave-${{ github.run_id }}-${{ github.job }}
          install_args: node@24 hurl@8.1.0
      - name: Install the frozen dependency graph
        run: npm ci
      - name: Resolve headless Chromium for preview smoke evidence
        env:
          CD_PWA_SMOKE_REQUIRE_HEADLESS_SHELL: "1"
        run: |
          set -euo pipefail
          path="$(node scripts/ci/ensure-chrome-headless-shell.mjs)"
          echo "PLAYWRIGHT_CHROMIUM=$path" >> "$GITHUB_ENV"
      - name: Save chrome-headless-shell cache
        if: env.TRUSTED_CACHE_SAVE == 'true' && steps.chrome-shell-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cd-chrome-headless-shell
          key: cd-chrome-headless-shell-${{ runner.os }}-156.0.8078.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pages-dist-${{ github.run_id }}
          path: apps/pages/dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-pages-pwa-release-${{ github.run_id }}
          path: apps/pages/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-pwa-meta-${{ github.run_id }}
          path: artifacts/cd-pwa-meta
      - name: Fast Preview deploy smoke
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          STAGED_DIST: apps/pages/dist
          STAGED_META: artifacts/cd-pwa-meta/release.json
          STAGED_PACKAGE: apps/pages/release/package.json
          SMOKE_EVIDENCE_OUT: artifacts/cd-pwa-preview-smoke
          CD_REGISTRY_VERSION_CONFIRMED: ${{ needs.npm_preview.result == 'success' && '1' || '' }}
          CD_PROOF_GATE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_gate_fail == true && '1' || '' }}
        run: node scripts/release/cd-pwa-preview-smoke/run.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cd-pwa-preview-smoke-${{ github.run_id }}
          path: artifacts/cd-pwa-preview-smoke
          if-no-files-found: error


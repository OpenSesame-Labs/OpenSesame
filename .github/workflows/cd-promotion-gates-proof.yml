# Pull-request proof for automated CD promotion gates (unit tests + forced failure).
name: CD promotion gates proof

on:
  pull_request:
    paths:
      - ".github/workflows/cd-npm-cli.yml"
      - ".github/workflows/cd-pwa.yml"
      - ".github/workflows/cd-promotion-gates-proof.yml"
      - "scripts/release/cd-*.mjs"
      - "scripts/release/npm-cd-workflows.test.mjs"
  workflow_dispatch:
    inputs:
      force_smoke_fail:
        description: When true, the simulated preview smoke gate fails and blocks promotion.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-promotion-gates-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Promotion gate unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - run: npm ci
      - name: Gate script tests
        run: |
          set -euo pipefail
          node --test \
            scripts/release/cd-main-ci-gate.test.mjs \
            scripts/release/cd-preview-smoke.test.mjs \
            scripts/release/npm-cd-workflows.test.mjs

  simulated_smoke_gate:
    name: Simulated preview smoke gate
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - name: Enforce preview smoke (simulated pass)
        run: |
          set -euo pipefail
          export CD_PREVIEW_SMOKE_SIMULATED=1
          export CD_PREVIEW_SMOKE_FORCE_FAIL=0
          export NPM_DIST_TAG=alpha
          node scripts/release/cd-preview-smoke.mjs

  gate_fail_blocks_promotion:
    name: Simulated preview smoke gate (must fail)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - name: Prove forced smoke failure blocks promotion
        run: |
          set -euo pipefail
          export CD_PREVIEW_SMOKE_FORCE_FAIL=1
          export NPM_DIST_TAG=alpha
          if node scripts/release/cd-preview-smoke.mjs; then
            echo "expected preview smoke gate to fail"
            exit 1
          fi
          echo "preview smoke gate failed; Production promotion would not run"

  simulated_production:
    name: Simulated Production promotion
    needs: simulated_smoke_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Production promotion would run here after every gate succeeded."

  simulated_production_after_failed_gate:
    name: Simulated Production promotion (must stay skipped)
    needs: gate_fail_blocks_promotion
    if: needs.gate_fail_blocks_promotion.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "Production ran after a failed preview smoke gate"
          exit 1

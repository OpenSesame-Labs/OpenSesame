# Fast PR feedback. Merge queue and required checks use ci.yml.
name: CI advisory

on:
  pull_request:
    branches: [main, "cursor/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisory:
    name: Format and anti-slop (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:anti-slop

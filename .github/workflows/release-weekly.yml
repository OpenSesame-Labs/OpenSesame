# Immutable candidate promotion; schedules qualify one selected source snapshot.
name: Weekly release promotion

on:
  schedule:
    - cron: "17 4 * * 4"
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  attestations: read

# Freeze and qualify one candidate through publication. A newer run must not
# cancel expensive checks or replace a shared prerelease target underneath them.
concurrency:
  group: candidate-release
  cancel-in-progress: false

jobs:
  select:
    name: Weekly selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      candidate_id: ${{ steps.select.outputs.candidate_id }}
      run_id: ${{ steps.select.outputs.run_id }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      payload_digest: ${{ steps.select.outputs.payload_digest }}
      dev_receipt: ${{ steps.select.outputs.dev_receipt }}
      promote: ${{ steps.select.outputs.promote }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node
      - name: Require implemented and activated release policy
        env:
          GH_TOKEN: ${{ github.token }}
        # Explicit readiness includes implemented publishers and bypass removal.
        # An unset policy must fail; do not turn publish into a silently skipped job.
        run: node scripts/release/candidate.mjs policy --controller release-weekly
      - name: Select once or resume this run's original candidate
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/candidate.mjs select-dev
          --workflow .github/workflows/dev-nightly.yml --max-age-hours 48
          --selection-file "$RUNNER_TEMP/weekly-selection/selection.json"
          --output "$GITHUB_OUTPUT"
      - name: Retain this attempt's immutable selection record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-selection/selection.json
          if-no-files-found: error
          retention-days: 35

  result:
    name: Weekly selection result
    needs: [select]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful selection
        run: test "${{ needs.select.result }}" = success

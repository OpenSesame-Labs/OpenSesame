# Continuation of weekly release promotion: qualification runs under workflow_run so
# reusable jobs do not inherit schedule/workflow_dispatch default-branch cache write.
name: Weekly release qualification

on:
  workflow_run:
    workflows: ["Weekly release promotion"]
    types: [completed]

permissions:
  actions: read
  contents: read
  attestations: read

concurrency:
  group: candidate-release-qualify-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resume:
    name: Resume weekly selection
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.load.outputs.source_sha }}
      candidate_id: ${{ steps.load.outputs.candidate_id }}
      run_id: ${{ steps.load.outputs.run_id }}
      run_attempt: ${{ steps.load.outputs.run_attempt }}
      artifact_id: ${{ steps.load.outputs.artifact_id }}
      artifact_digest: ${{ steps.load.outputs.artifact_digest }}
      payload_digest: ${{ steps.load.outputs.payload_digest }}
      dev_receipt: ${{ steps.load.outputs.dev_receipt }}
      promote: ${{ steps.load.outputs.promote }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            scripts/lib
            .github/workflows
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: weekly-selection-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/weekly-selection
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Load the frozen weekly selection
        id: load
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_RUN_ID: ${{ github.event.workflow_run.id }}
          CONTROLLER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONTROLLER_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/release-weekly.yml@refs/heads/main
          CONTROLLER_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node scripts/release/candidate.mjs resume-weekly-selection
          --selection-file "$RUNNER_TEMP/weekly-selection/selection.json"
          --controller-run-id "$CONTROLLER_RUN_ID"
          --controller-run-attempt "$CONTROLLER_RUN_ATTEMPT"
          --controller-workflow-ref "$CONTROLLER_WORKFLOW_REF"
          --controller-workflow-sha "$CONTROLLER_WORKFLOW_SHA"
          --output "$GITHUB_OUTPUT"

  prerelease:
    needs: resume
    if: ${{ needs.resume.outputs.promote == 'true' }}
    uses: ./.github/workflows/ci-prerelease-checks.yml
    with:
      source_sha: ${{ needs.resume.outputs.source_sha }}
      candidate_id: ${{ needs.resume.outputs.candidate_id }}
      run_id: ${{ needs.resume.outputs.run_id }}
      run_attempt: ${{ needs.resume.outputs.run_attempt }}
      artifact_id: ${{ needs.resume.outputs.artifact_id }}
      artifact_digest: ${{ needs.resume.outputs.artifact_digest }}
      payload_digest: ${{ needs.resume.outputs.payload_digest }}
      prerequisite_receipt: ${{ needs.resume.outputs.dev_receipt }}

  mutation:
    needs: [resume, prerelease]
    uses: ./.github/workflows/ci-release-checks.yml
    permissions:
      actions: read
      contents: read
      attestations: read
      security-events: write
    with:
      suite: mutation
      source_sha: ${{ needs.resume.outputs.source_sha }}
      candidate_id: ${{ needs.resume.outputs.candidate_id }}
      run_id: ${{ needs.resume.outputs.run_id }}
      run_attempt: ${{ needs.resume.outputs.run_attempt }}
      artifact_id: ${{ needs.resume.outputs.artifact_id }}
      artifact_digest: ${{ needs.resume.outputs.artifact_digest }}
      payload_digest: ${{ needs.resume.outputs.payload_digest }}
      prerequisite_receipt: ${{ needs.prerelease.outputs.receipt }}

  security:
    needs: [resume, prerelease]
    uses: ./.github/workflows/ci-release-checks.yml
    permissions:
      actions: read
      contents: read
      attestations: read
      security-events: write
    with:
      suite: security
      source_sha: ${{ needs.resume.outputs.source_sha }}
      candidate_id: ${{ needs.resume.outputs.candidate_id }}
      run_id: ${{ needs.resume.outputs.run_id }}
      run_attempt: ${{ needs.resume.outputs.run_attempt }}
      artifact_id: ${{ needs.resume.outputs.artifact_id }}
      artifact_digest: ${{ needs.resume.outputs.artifact_digest }}
      payload_digest: ${{ needs.resume.outputs.payload_digest }}
      prerequisite_receipt: ${{ needs.prerelease.outputs.receipt }}

  publish:
    needs: [resume, prerelease, mutation, security]
    uses: ./.github/workflows/release-publish.yml
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      attestations: write
    with:
      source_sha: ${{ needs.resume.outputs.source_sha }}
      candidate_id: ${{ needs.resume.outputs.candidate_id }}
      run_id: ${{ needs.resume.outputs.run_id }}
      run_attempt: ${{ needs.resume.outputs.run_attempt }}
      artifact_id: ${{ needs.resume.outputs.artifact_id }}
      artifact_digest: ${{ needs.resume.outputs.artifact_digest }}
      payload_digest: ${{ needs.resume.outputs.payload_digest }}
      prerelease_receipt: ${{ needs.prerelease.outputs.receipt }}
      mutation_receipt: ${{ needs.mutation.outputs.receipt }}
      security_receipt: ${{ needs.security.outputs.receipt }}

  result:
    name: Weekly promotion result
    needs: [resume, prerelease, mutation, security, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESUME_RESULT: ${{ needs.resume.result }}
      PROMOTE: ${{ needs.resume.outputs.promote }}
      PRERELEASE_RESULT: ${{ needs.prerelease.result }}
      MUTATION_RESULT: ${{ needs.mutation.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
    steps:
      - name: Accept only complete publication or the explicit identical-release no-op
        run: |
          test "$RESUME_RESULT" = success
          case "$PROMOTE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$PRERELEASE_RESULT" = "$expected"
          test "$MUTATION_RESULT" = "$expected"
          test "$SECURITY_RESULT" = "$expected"
          test "$PUBLISH_RESULT" = "$expected"

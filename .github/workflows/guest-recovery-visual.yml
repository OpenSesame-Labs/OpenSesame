# Disposable review evidence only. This workflow is not merged to production.
name: Guest recovery phone evidence
on:
  push:
    branches: [codex/guest-recovery-visual]
permissions: {}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the disposable evidence controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Resolve the current stacked PR heads
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/2774" > "$RUNNER_TEMP/baseline-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/2806" > "$RUNNER_TEMP/head-pr.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const read = name => JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,name),'utf8'));
          const base = read('baseline-pr.json'), head = read('head-pr.json');
          assert.equal(base.number, 2774); assert.equal(head.number, 2806);
          assert.equal(base.state, 'open'); assert.equal(head.state, 'open');
          assert.equal(base.head.repo.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(head.head.repo.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(head.base.ref, base.head.ref);
          assert.equal(head.base.sha, base.head.sha);
          for (const sha of [base.head.sha,head.head.sha]) assert.match(sha,/^[a-f0-9]{40}$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `baseline=${base.head.sha}\nhead=${head.head.sha}\n`);
          NODE
      - name: Check out baseline #2774
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.refs.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - name: Check out guest fix #2806
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.refs.outputs.head }}
          path: head
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: head
          install_args: node@24
          cache: false
          cache_save: false
          persist_github_token: false
      - name: Install locked dependencies without lifecycle scripts
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          (cd baseline && npm ci --ignore-scripts)
          (cd head && npm ci --ignore-scripts)
      - name: Compare the same signed-in browser in a restricted container
        env:
          BASELINE_SHA: ${{ steps.refs.outputs.baseline }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C head rev-parse HEAD)" = "$HEAD_SHA"
          git -C baseline diff --exit-code
          git -C head diff --exit-code
          base_tree="$(git -C baseline rev-parse 'HEAD^{tree}')"
          head_tree="$(git -C head rev-parse 'HEAD^{tree}')"
          node_binary="$(node -p 'process.execPath')"
          test "$("$node_binary" -p 'process.versions.node.split(".")[0]')" = 24
          mkdir -p "$RUNNER_TEMP/guest-evidence"
          mounts=()
          for checkout in baseline head; do
            for target in node_modules/.vite node_modules/.vite-temp apps/pages/node_modules/.vite apps/pages/node_modules/.vite-temp; do
              test "$(realpath -m "$GITHUB_WORKSPACE/$checkout/$target")" = "$GITHUB_WORKSPACE/$checkout/$target"
              mkdir -p "$GITHUB_WORKSPACE/$checkout/$target"
              scratch="$RUNNER_TEMP/guest-cache-${#mounts[@]}"
              mkdir -p "$scratch"
              mounts+=(--mount "type=bind,source=$scratch,target=/$checkout/$target")
            done
            target=apps/pages/dist
            test "$(realpath -m "$GITHUB_WORKSPACE/$checkout/$target")" = "$GITHUB_WORKSPACE/$checkout/$target"
            mkdir -p "$GITHUB_WORKSPACE/$checkout/$target" "$RUNNER_TEMP/guest-dist-$checkout"
            mounts+=(--mount "type=bind,source=$RUNNER_TEMP/guest-dist-$checkout,target=/$checkout/$target")
            port=5198
            if [ "$checkout" = head ]; then port=5199; fi
            profile="$RUNNER_TEMP/guest-profile-$checkout.json"
            printf '{"version":1,"profile":"loopback_development","canonicalOrigin":"http://127.0.0.1:%s","headerSecurity":false}\n' "$port" > "$profile"
            test ! -L "$GITHUB_WORKSPACE/$checkout/apps/pages/public/security-profile.json"
            mounts+=(--mount "type=bind,source=$profile,target=/$checkout/apps/pages/public/security-profile.json,readonly")
          done
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --pids-limit 512 --memory 6g --cpus 2 --shm-size 512m \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,mode=1777 \
            --mount "type=bind,source=$node_binary,target=/usr/bin/node,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/baseline,target=/baseline,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/head,target=/head,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/controller/scripts/ci/guest-recovery-visual.mjs,target=/capture.mjs,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/guest-evidence,target=/out" \
            "${mounts[@]}" --workdir /head \
            --env HOME=/tmp --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env "BASELINE_SHA=$BASELINE_SHA" --env "BASELINE_TREE=$base_tree" \
            --env "HEAD_SHA=$HEAD_SHA" --env "HEAD_TREE=$head_tree" \
            --entrypoint /usr/bin/node \
            mcr.microsoft.com/playwright@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366 \
            /capture.mjs
      - name: Validate the synthetic output
        env:
          BASELINE_SHA: ${{ steps.refs.outputs.baseline }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { lstatSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const dir=join(process.env.RUNNER_TEMP,'guest-evidence');
          const files=['baseline-320.png','baseline-390.png','head-320.png','head-390.png','manifest.json'];
          assert.deepEqual(readdirSync(dir).sort(),files);
          for(const file of files){const s=lstatSync(join(dir,file));assert.ok(s.isFile()&&!s.isSymbolicLink()&&s.size>0&&s.size<1_000_000);}
          const m=JSON.parse(readFileSync(join(dir,'manifest.json'),'utf8'));
          for(const [key,path,sha] of [['baseline','baseline',process.env.BASELINE_SHA],['head','head',process.env.HEAD_SHA]]) {
            assert.equal(m[key].source,sha);
            assert.equal(m[key].tree,execFileSync('git',['-C',path,'rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());
          }
          assert.deepEqual(m.screens.map(s=>s.width),[320,390]);
          assert.equal(m.build,'Vite production builds with minimal-local capability profiles');
          for(const screen of m.screens) {
            assert.ok(['guest-vault','sign-out-required'].includes(screen.baseline.outcome));
            assert.equal(screen.head.outcome,'sign-out-required');
            assert.equal(screen.head.oldCookieStatus,401);
            assert.ok(screen.head.signOut.hit&&screen.head.signOut.width>=44&&screen.head.signOut.height>=44);
            for(const key of ['baseline','head']) {
              const shot=screen[key]; assert.equal(shot.file,`${key}-${screen.width}.png`);
              const data=readFileSync(join(dir,shot.file));
              assert.equal(data.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
              assert.equal(data.readUInt32BE(16),screen.width*2); assert.equal(data.readUInt32BE(20),screen.height*2);
              assert.equal(createHash('sha256').update(data).digest('hex'),shot.sha256);
            }
          }
          NODE
      - name: Recheck both PR heads before retaining evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: ${{ steps.refs.outputs.baseline }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2774" --jq .head.sha)" = "$BASELINE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2806" --jq .head.sha)" = "$HEAD_SHA"
      - name: Retain phone comparison for PR review
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-recovery-comparison-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guest-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Link the artifact
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf 'Guest recovery phone comparison: %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

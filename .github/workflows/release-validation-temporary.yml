name: Temporary release validation
on:
  push:
    branches: [codex/release-verification-20261118]
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1f0cee253cc0371c9ca38c1952706867dd5631d4
          path: candidate
          persist-credentials: false
      - name: Verify the reviewed branch and tree
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "1f0cee253cc0371c9ca38c1952706867dd5631d4"
          test "$(git rev-parse HEAD^{tree})" = "77839905c8e6b0336715e02939578651f3b4b86b"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          cache: false
          install_args: node@24
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Check Pages and tutorial behavior
        working-directory: candidate
        run: |
          npm run typecheck -w @opensesame/pages
          npm run quality:gate
          npm exec -w @opensesame/pages -- vitest run src/tutorial/coach src/components/StatusMark.test.tsx src/sections/vault/RotationPanel.test.tsx src/sections/vault/ItemEditor.limits.test.tsx
          npm exec -w @opensesame/app-core -- vitest run src/tutorial/registry/gate-goals.test.ts src/tutorial/registry/copy-accuracy.test.ts
      - name: Build the reviewed app
        working-directory: candidate
        env:
          VITE_BASE: /OpenSesame/
        run: node scripts/lib/ci-pages-build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-review-dist
          path: candidate/apps/pages/dist/
          retention-days: 2
          if-no-files-found: error

  catalog:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1f0cee253cc0371c9ca38c1952706867dd5631d4
          path: candidate
          persist-credentials: false
      - name: Verify the reviewed branch and tree
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "1f0cee253cc0371c9ca38c1952706867dd5631d4"
          test "$(git rev-parse HEAD^{tree})" = "77839905c8e6b0336715e02939578651f3b4b86b"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          cache: false
          install_args: node@24
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: final-review-dist
          path: candidate/apps/pages/dist/
      - name: Walk the mobile tutorial catalog
        id: walk
        continue-on-error: true
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
          TUTORIALS_WIDTHS: 320,390
          TUTORIALS_SHARD: ${{ matrix.shard }}/4
          TUTORIALS_ENABLE: except-ai
          TUTORIALS_AI: "off"
          TUTORIALS_OUT: ${{ runner.temp }}/tutorial-catalog
        run: npm run verify:tutorials -w @opensesame/pages > "$RUNNER_TEMP/catalog.log" 2>&1
      - name: Report tutorial results
        if: always()
        env:
          WALK_OUTCOME: ${{ steps.walk.outcome }}
        run: |
          node -e 'const fs=require("node:fs");const p=`${process.env.RUNNER_TEMP}/catalog.log`;console.log(`tutorial catalog: ${process.env.WALK_OUTCOME || "not run"}`);if(fs.existsSync(p)){for(const line of fs.readFileSync(p,"utf8").split("\n"))if(/checks passed|^\s*FAIL |tutorials walked|gates walked/.test(line))console.log(line);}if(process.env.WALK_OUTCOME!=="success")process.exitCode=1;'

  first_vault:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1f0cee253cc0371c9ca38c1952706867dd5631d4
          path: candidate
          persist-credentials: false
      - name: Verify the reviewed branch and tree
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "1f0cee253cc0371c9ca38c1952706867dd5631d4"
          test "$(git rev-parse HEAD^{tree})" = "77839905c8e6b0336715e02939578651f3b4b86b"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          cache: false
          install_args: node@24
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: final-review-dist
          path: candidate/apps/pages/dist/
      - name: Walk and capture the first password journey
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
          TUTORIALS_WIDTHS: 320,390,1280
          TUTORIALS_ONLY: gate.front-door
          TUTORIALS_ENABLE: except-ai
          TUTORIALS_AI: "off"
          TUTORIALS_SHOTS: "1"
          TUTORIALS_KEYBOARD_VIEWPORT: "1"
          TUTORIALS_OUT: ${{ runner.temp }}/first-vault
        run: npm run verify:tutorials -w @opensesame/pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-first-vault-evidence
          path: ${{ runner.temp }}/first-vault/
          retention-days: 7
          if-no-files-found: warn

      - name: Verify generation failure and retry on phones
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
          TUTORIALS_WIDTHS: 320,390
          TUTORIALS_ONLY: gate.front-door
          TUTORIALS_ENABLE: except-ai
          TUTORIALS_AI: "off"
          TUTORIALS_GENERATION_FAILURE: "1"
          TUTORIALS_OUT: ${{ runner.temp }}/first-vault-retry
        run: npm run verify:tutorials -w @opensesame/pages

      - name: Walk and capture the first password journey in dark mode
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
          TUTORIALS_WIDTHS: 390
          TUTORIALS_ONLY: gate.front-door
          TUTORIALS_ENABLE: except-ai
          TUTORIALS_AI: "off"
          TUTORIALS_COLOR_SCHEME: dark
          TUTORIALS_SHOTS: "1"
          TUTORIALS_KEYBOARD_VIEWPORT: "1"
          TUTORIALS_OUT: ${{ runner.temp }}/first-vault-dark
        run: npm run verify:tutorials -w @opensesame/pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-first-vault-dark-evidence
          path: ${{ runner.temp }}/first-vault-dark/
          retention-days: 7
          if-no-files-found: warn

      - name: Walk and capture model settings on phones
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
          TUTORIALS_WIDTHS: 320,390
          TUTORIALS_ONLY: settings.model-provider
          TUTORIALS_ENABLE: all
          TUTORIALS_SHOTS: "1"
          TUTORIALS_OUT: ${{ runner.temp }}/model-guide
        run: npm run verify:tutorials -w @opensesame/pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-model-guide-evidence
          path: ${{ runner.temp }}/model-guide/
          retention-days: 7
          if-no-files-found: warn

  rotation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1f0cee253cc0371c9ca38c1952706867dd5631d4
          path: candidate
          persist-credentials: false
      - name: Verify the reviewed branch and tree
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "1f0cee253cc0371c9ca38c1952706867dd5631d4"
          test "$(git rev-parse HEAD^{tree})" = "77839905c8e6b0336715e02939578651f3b4b86b"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          cache: false
          install_args: node@24
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: final-review-dist
          path: candidate/apps/pages/dist/
      - name: Verify mobile rotation and copying
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
          PAGES_VERIFY_OUT: ${{ runner.temp }}/rotation
        run: npm run verify:rotation-mobile -w @opensesame/pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-rotation-evidence
          path: ${{ runner.temp }}/rotation/
          retention-days: 7
          if-no-files-found: warn

      - name: Verify mobile rotation and copying in dark mode
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
          PAGES_VERIFY_COLOR_SCHEME: dark
          PAGES_VERIFY_OUT: ${{ runner.temp }}/rotation-dark
        run: npm run verify:rotation-mobile -w @opensesame/pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-rotation-dark-evidence
          path: ${{ runner.temp }}/rotation-dark/
          retention-days: 7
          if-no-files-found: warn

  keyboard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1f0cee253cc0371c9ca38c1952706867dd5631d4
          path: candidate
          persist-credentials: false
      - name: Verify the reviewed branch and tree
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "1f0cee253cc0371c9ca38c1952706867dd5631d4"
          test "$(git rev-parse HEAD^{tree})" = "77839905c8e6b0336715e02939578651f3b4b86b"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          cache: false
          install_args: node@24
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: final-review-dist
          path: candidate/apps/pages/dist/
      - name: Verify the real keyboard journey
        id: keyboard
        continue-on-error: true
        working-directory: candidate
        env:
          VITE_BASE: /OpenSesame/
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          PAGES_VERIFY_OUT: ${{ runner.temp }}/keyboard
        run: npm run verify:keyboard -w @opensesame/pages > "$RUNNER_TEMP/keyboard.log" 2>&1
      - name: Report sanitized diagnostics
        if: always()
        env:
          KEYBOARD_OUTCOME: ${{ steps.keyboard.outcome }}
        run: |
          node -e 'const fs=require("node:fs");const p=`${process.env.RUNNER_TEMP}/keyboard.log`;console.log(`keyboard: ${process.env.KEYBOARD_OUTCOME || "not run"}`);if(fs.existsSync(p)){const s=fs.readFileSync(p,"utf8");for(const line of s.split("\n"))if(line.startsWith("PASS "))console.log(line);for(const name of ["toBeVisible","toBeFocused","toHaveURL","toBeEnabled","TimeoutError","Timeout","connection did not form","Keyboard journey reported browser errors"])if(s.includes(name))console.log(`diagnostic: ${name}`);for(const m of new Set(s.match(/(?:verify-keyboard|live-keyboard-contract|live-keyboard-entry)\.mjs:\d+:\d+/g)||[]))console.log(`location: ${m}`);}if(process.env.KEYBOARD_OUTCOME!=="success")process.exitCode=1;'

  repository_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: [lint, quality, typecheck, test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1f0cee253cc0371c9ca38c1952706867dd5631d4
          path: candidate
          persist-credentials: false
          fetch-depth: 100
      - name: Verify the reviewed branch and tree
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "1f0cee253cc0371c9ca38c1952706867dd5631d4"
          test "$(git rev-parse HEAD^{tree})" = "77839905c8e6b0336715e02939578651f3b4b86b"
          git fetch --no-tags --depth=100 origin +refs/heads/main:refs/remotes/origin/main
          git merge-base HEAD origin/main > /dev/null
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          cache: false
          install_args: node@24
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Run repository check
        working-directory: candidate
        run: npm run "${{ matrix.check }}"

  visual_comparison:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 238f8d758a015ec00d7abf680c9fd91c1cdb1289
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1f0cee253cc0371c9ca38c1952706867dd5631d4
          path: candidate
          persist-credentials: false
      - name: Verify source revisions
        run: |
          test "$(git -C baseline rev-parse HEAD)" = "238f8d758a015ec00d7abf680c9fd91c1cdb1289"
          test "$(git -C candidate rev-parse HEAD)" = "1f0cee253cc0371c9ca38c1952706867dd5631d4"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          cache: false
          install_args: node@24
      - name: Build baseline
        working-directory: baseline
        env:
          VITE_BASE: /OpenSesame/
        run: |
          npm ci --ignore-scripts
          node scripts/lib/ci-pages-build.mjs
      - name: Install candidate dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: final-review-dist
          path: candidate/apps/pages/dist/
      - name: Capture the same first visit on both builds
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: |
          set -o pipefail
          J=work/evidence/tutorial/pages/web/journey.json
          mkdir -p "$(dirname "$J")"
          cat > "$J" <<'JOURNEY'
          {"out":".","screens":[{"width":320,"height":700,"steps":[{"shot":"320-offer"},{"press":"Show me|Start tutorial"},{"measure":".coach__card, .driver-popover"},{"measure":"[data-guide-targets~=\"unlock.setup\"]"},{"shot":"320-first-step"}]},{"width":1280,"height":900,"desktop":true,"steps":[{"shot":"1280-offer"},{"press":"Show me|Start tutorial"},{"measure":".coach__card, .driver-popover"},{"measure":"[data-guide-targets~=\"unlock.setup\"]"},{"shot":"1280-first-step"}]}],"sheets":[{"shot":"320-offer","width":320,"title":"First visit \u2014 phone","caption":"The same first visit on the base and updated builds."},{"shot":"320-first-step","width":320,"title":"Tutorial start \u2014 phone","caption":"The same action on the base and updated builds; browser box measurements are in the capture log."},{"shot":"1280-offer","width":640,"title":"First visit \u2014 desktop","caption":"The same first visit on the base and updated builds, captured at 1280 px."},{"shot":"1280-first-step","width":640,"title":"Tutorial start \u2014 desktop","caption":"The same action on the base and updated builds; browser box measurements are in the capture log."}]}
          JOURNEY
          EVIDENCE_DIST="$GITHUB_WORKSPACE/baseline/apps/pages/dist" node apps/pages/scripts/capture-evidence.mjs capture before "$J" | tee work/evidence/tutorial/pages/web/before-measurements.txt
          EVIDENCE_DIST="$GITHUB_WORKSPACE/candidate/apps/pages/dist" node apps/pages/scripts/capture-evidence.mjs capture after "$J" | tee work/evidence/tutorial/pages/web/after-measurements.txt
          node apps/pages/scripts/capture-evidence.mjs compose "$J"
          SHOTS=$(node --input-type=module -e 'import {captureShotsDirectory} from "./apps/pages/scripts/lib/evidence-paths.mjs"; console.log(captureShotsDirectory(process.argv[1]));' "$J")
          cp -R "$SHOTS/before" "$SHOTS/after" work/evidence/tutorial/pages/web/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tutorial-visual-comparison
          path: candidate/work/evidence/tutorial/pages/web/
          retention-days: 14
          if-no-files-found: warn

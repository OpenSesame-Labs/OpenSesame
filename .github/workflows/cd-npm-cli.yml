# Publish @opensesame-labs/cli after main merges.
# Stage once, beside the Main CI gate. Preview waits for both.
# Preview publishes 0.0.0-alpha.N on alpha under environment Preview (no reviewer wait).
# Production publishes 0.0.0-next.N on next with NPM_TOKEN (OIDC when that token is empty).
name: CD npm CLI

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "scripts/release/plan-cli-release.mjs"
      - "scripts/release/plan-npm-cd-release.mjs"
      - "scripts/release/npm-prerelease-version.mjs"
      - "scripts/release/prepare-cli-release.mjs"
      - "scripts/release/npm-publish-names.mjs"
      - "scripts/release/cd-release-meta.mjs"
      - "scripts/release/cd-main-ci-gate.mjs"
      - "scripts/release/cd-preview-smoke.mjs"
      - "scripts/release/cd-registry-wait.mjs"
      - "scripts/release/cd-production-npm-version.mjs"
      - "scripts/release/cd-promotion-notify.mjs"
      - ".github/actions/publish-npm-package/**"
      - ".github/workflows/cd-npm-cli.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop after staging (before preview publish and Production).
        required: false
        type: boolean
        default: false
      proof_gate_fail:
        description: When true, preview smoke fails on purpose (live gate proof on main only).
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

# Pending runs otherwise stay queued with no jobs until the active run ends.
env:
  # Job-local npm downloads. This workflow does not restore or save the Actions cache.
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

concurrency:
  group: cd-npm-cli
  cancel-in-progress: true

jobs:
  main_ci:
    name: Main CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/release
            /mise.toml
            /mise.lock
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node@24
      - name: Require trunk CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          # 5s polls. Attempts keep the default sleep budget:
          # (475 - 1) * 5000 ms = (80 - 1) * 30000 ms.
          # Still requires TypeScript, Rust, and Bundle budgets on this SHA.
          CI_GATE_INTERVAL_MS: "5000"
          CI_GATE_ATTEMPTS: "475"
        run: node scripts/release/cd-main-ci-gate.mjs

  stage:
    name: Stage CLI release
    # Overlaps the gate. Preview needs both jobs, so a red gate does not publish.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm_dist_tag: ${{ steps.plan.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node@24
      - name: Plan version
        id: plan
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          node scripts/release/plan-cli-release.mjs --mode cd --sha "$short" | tee /tmp/plan.txt
          version="$(sed -n 's/^version=//p' /tmp/plan.txt)"
          npm_dist_tag="$(sed -n 's/^npm_dist_tag=//p' /tmp/plan.txt)"
          test -n "$version"
          test -n "$npm_dist_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"
      - name: Install the frozen dependency graph
        run: npm ci
      - name: Build the CLI for npm publish
        env:
          CLI_RELEASE_PACK: "1"
        run: npm run build -w @opensesame/cli
      - name: Stage publish tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/prepare-cli-release.mjs
      - name: npm publish dry-run
        working-directory: packages/cli/release
        env:
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: npm publish --dry-run --access public --tag "$NPM_DIST_TAG"
      - name: Record release metadata
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: node scripts/release/cd-release-meta.mjs write artifacts/cd-npm-cli-meta/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
          if-no-files-found: error

  preview:
    name: Preview npm publish
    needs: [stage, main_ci]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: Preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release
            scripts/lib
            .github/actions/publish-npm-package
            /mise.toml
            /mise.lock
            /package.json
            /package-lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node@24
      - name: Require the staged metadata
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
        run: node scripts/release/cd-release-meta.mjs check artifacts/cd-npm-cli-meta/release.json packages/cli/release/package.json
      # Preview environment supplies NPM_TOKEN (publish-npm-package → NODE_AUTH_TOKEN + .npmrc).
      # No required reviewers on Preview; otherwise OIDC trusted publishing under the same environment.
      - uses: ./.github/actions/publish-npm-package
        with:
          working-directory: packages/cli/release
          npm-dist-tag: ${{ needs.stage.outputs.npm_dist_tag }}
          npm-token: ${{ secrets.NPM_TOKEN }}
      - name: Wait until the published version is visible
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
        run: |
          set -euo pipefail
          # publish-npm-package leaves NPM_CONFIG_USERCONFIG on a token npmrc.
          # This view is anonymous, same as preview smoke.
          unset NPM_CONFIG_USERCONFIG NODE_AUTH_TOKEN
          node scripts/release/cd-registry-wait.mjs

  preview_smoke:
    name: Preview npm smoke
    needs: [stage, preview]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/release
            /mise.toml
            /mise.lock
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node@24
      - name: Prove alpha npm resolves and runs
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
          CD_REGISTRY_VERSION_CONFIRMED: ${{ needs.preview.result == 'success' && '1' || '' }}
          CD_PROOF_GATE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_gate_fail == true && '1' || '' }}
        run: node scripts/release/cd-preview-smoke.mjs

  production:
    name: Production npm publish
    needs: [stage, preview, preview_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: Production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release
            scripts/lib
            .github/actions/publish-npm-package
            /mise.toml
            /mise.lock
            /package.json
            /package-lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node@24
      - name: Require the staged metadata
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
        run: node scripts/release/cd-release-meta.mjs check artifacts/cd-npm-cli-meta/release.json packages/cli/release/package.json
      - name: Rewrite alpha version to 0.0.0-next.N
        run: node scripts/release/cd-production-npm-version.mjs rewrite packages/cli/release/package.json
      # Production environment secret NPM_TOKEN. Empty token keeps OIDC.
      # Same staged tarball, tag next, provenance. Never latest.
      - name: Publish 0.0.0-next.N on next
        uses: ./.github/actions/publish-npm-package
        with:
          working-directory: packages/cli/release
          npm-dist-tag: next
          npm-token: ${{ secrets.NPM_TOKEN }}

  promotion_failed:
    name: Promotion failure notice
    needs: [main_ci, stage, preview, preview_smoke, production]
    if: failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Commit comments need contents: write. The issues permission does not cover them.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/release
            /mise.toml
            /mise.lock
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node@24
      - name: Annotate the run and comment on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_MAIN_CI: ${{ needs.main_ci.result }}
          GATE_STAGE: ${{ needs.stage.result }}
          GATE_PREVIEW: ${{ needs.preview.result }}
          GATE_PREVIEW_SMOKE: ${{ needs.preview_smoke.result }}
          GATE_PRODUCTION: ${{ needs.production.result }}
        run: node scripts/release/cd-promotion-notify.mjs

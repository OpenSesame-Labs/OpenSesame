# Stage and prove @opensesame-labs/cli after main merges.
# Stage once, beside the Main CI gate. Local proof waits for both.
# npm publication is disabled until qualified candidate promotion exists.
name: CD npm CLI

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "scripts/release/plan-cli-release.mjs"
      - "scripts/release/plan-npm-cd-release.mjs"
      - "scripts/release/npm-prerelease-version.mjs"
      - "scripts/release/prepare-cli-release.mjs"
      - "scripts/release/npm-publish-names.mjs"
      - "scripts/release/npm-local-package-smoke.mjs"
      - "scripts/release/cd-release-meta.mjs"
      - "scripts/release/cd-main-ci-gate.mjs"
      - "scripts/release/cd-preview-smoke.mjs"
      - "scripts/release/cd-preview-smoke-registry.mjs"
      - "scripts/release/cd-registry-wait.mjs"
      - "scripts/release/cd-production-npm-version.mjs"
      - "scripts/release/cd-promotion-notify.mjs"
      - ".github/actions/publish-npm-package/**"
      - ".github/workflows/cd-npm-cli.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop after staging (before local package proof).
        required: false
        type: boolean
        default: false
      proof_gate_fail:
        description: When true, preview smoke fails on purpose (live gate proof on main only).
        required: false
        type: boolean
        default: false

permissions: {}

# Pending runs otherwise stay queued with no jobs until the active run ends.
env:
  # Job-local npm downloads. npm is not restored or saved.
  # The mise tool directory is restored read-only from the trunk CI key and never saved.
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

concurrency:
  group: cd-npm-cli
  cancel-in-progress: true

jobs:
  main_ci:
    name: Main CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/release
            /mise.toml
            /mise.lock
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node 24
        run: bash scripts/lib/install-mise-locked.sh node@24
      - name: Require trunk CI for this commit
        env:
          GITHUB_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          # 5s polls. Attempts keep the default sleep budget:
          # (475 - 1) * 5000 ms = (80 - 1) * 30000 ms.
          # Still requires TypeScript, Rust, and Bundle budgets on this SHA.
          CI_GATE_INTERVAL_MS: "5000"
          CI_GATE_ATTEMPTS: "475"
        run: node scripts/release/cd-main-ci-gate.mjs

  stage:
    name: Stage CLI release
    # Overlaps the gate. Preview needs both jobs, so a red gate does not publish.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm_dist_tag: ${{ steps.plan.outputs.npm_dist_tag }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node 24
        run: bash scripts/lib/install-mise-locked.sh node@24
      - name: Plan version
        id: plan
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          node scripts/release/plan-cli-release.mjs --mode cd --local-proof --sha "$short" | tee /tmp/plan.txt
          version="$(sed -n 's/^version=//p' /tmp/plan.txt)"
          npm_dist_tag="$(sed -n 's/^npm_dist_tag=//p' /tmp/plan.txt)"
          test -n "$version"
          test -n "$npm_dist_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"
      - name: Install the frozen dependency graph
        run: npm ci --ignore-scripts
      - name: Build the CLI for npm publish
        env:
          CLI_RELEASE_PACK: "1"
        run: npm run build -w @opensesame/cli
      - name: Stage publish tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/prepare-cli-release.mjs
      - name: npm publish dry-run
        working-directory: packages/cli/release
        env:
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: npm publish --dry-run --ignore-scripts --offline --access public --tag "$NPM_DIST_TAG"
      - name: Record release metadata
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: node scripts/release/cd-release-meta.mjs write artifacts/cd-npm-cli-meta/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
          if-no-files-found: error

  preview:
    name: Preview npm package proof
    needs: [stage, main_ci]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release
            scripts/lib
            /mise.toml
            /mise.lock
            /package.json
            /package-lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node 24
        run: bash scripts/lib/install-mise-locked.sh node@24
      - name: Require the staged metadata
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
        run: node scripts/release/cd-release-meta.mjs check artifacts/cd-npm-cli-meta/release.json packages/cli/release/package.json
      - name: Check the staged npm package locally
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
        run: node scripts/release/npm-local-package-smoke.mjs packages/cli/release '@opensesame-labs/cli' "$EXPECTED_VERSION"

  preview_smoke:
    name: Local npm CLI smoke
    needs: [stage, preview]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/release
            /mise.toml
            /mise.lock
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node 24
        run: bash scripts/lib/install-mise-locked.sh node@24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
      - name: Install and run the staged npm CLI locally
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
          CD_PROOF_GATE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_gate_fail == true && '1' || '' }}
        run: node scripts/release/npm-local-package-smoke.mjs packages/cli/release '@opensesame-labs/cli' "$EXPECTED_VERSION" --run-cli

  production:
    name: npm publication disabled
    needs: [stage, preview, preview_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Explain the publication boundary
        run: echo "::notice::npm publication is disabled until qualified candidate-bound promotion is implemented."

  promotion_failed:
    name: Promotion failure notice
    needs: [main_ci, stage, preview, preview_smoke, production]
    if: failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Commit comments need contents: write. The issues permission does not cover them.
    # Read-only mise tool cache restore needs actions: read. This job does not save.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/lib
            scripts/release
            /mise.toml
            /mise.lock
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node 24
        run: bash scripts/lib/install-mise-locked.sh node@24
      - name: Annotate the run and comment on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_MAIN_CI: ${{ needs.main_ci.result }}
          GATE_STAGE: ${{ needs.stage.result }}
          GATE_PREVIEW: ${{ needs.preview.result }}
          GATE_PREVIEW_SMOKE: ${{ needs.preview_smoke.result }}
          GATE_PRODUCTION: ${{ needs.production.result }}
        run: node scripts/release/cd-promotion-notify.mjs

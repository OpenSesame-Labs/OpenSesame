# Publish @opensesame-labs/cli after main merges.
# Stage once. Preview publishes alpha with no environment wait.
# Production promotes when automated gates pass.
name: CD npm CLI

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "scripts/release/plan-cli-release.mjs"
      - "scripts/release/plan-npm-cd-release.mjs"
      - "scripts/release/npm-prerelease-version.mjs"
      - "scripts/release/prepare-cli-release.mjs"
      - "scripts/release/npm-publish-names.mjs"
      - "scripts/release/cd-release-meta.mjs"
      - "scripts/release/cd-main-ci-gate.mjs"
      - "scripts/release/cd-preview-smoke.mjs"
      - "scripts/release/cd-promotion-notify.mjs"
      - ".github/actions/publish-npm-package/**"
      - ".github/workflows/cd-npm-cli.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop after staging (before preview publish and Production).
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

# Pending runs otherwise stay queued with no jobs until the active run ends.
concurrency:
  group: cd-npm-cli
  cancel-in-progress: true

jobs:
  main_ci:
    name: Main CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - name: Require trunk CI for this commit
        run: node scripts/release/cd-main-ci-gate.mjs

  stage:
    name: Stage CLI release
    needs: main_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm_dist_tag: ${{ steps.plan.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node@24
      - name: Plan version
        id: plan
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          node scripts/release/plan-cli-release.mjs --mode cd --sha "$short" | tee /tmp/plan.txt
          version="$(sed -n 's/^version=//p' /tmp/plan.txt)"
          npm_dist_tag="$(sed -n 's/^npm_dist_tag=//p' /tmp/plan.txt)"
          test -n "$version"
          test -n "$npm_dist_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build -w @opensesame/cli
      - name: Stage publish tree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release/prepare-cli-release.mjs
      - name: npm publish dry-run
        working-directory: packages/cli/release
        env:
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: npm publish --dry-run --access public --tag "$NPM_DIST_TAG"
      - name: Record release metadata
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: node scripts/release/cd-release-meta.mjs write artifacts/cd-npm-cli-meta/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
          if-no-files-found: error

  preview:
    name: Preview npm publish
    needs: stage
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - name: Require the staged metadata
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
        run: node scripts/release/cd-release-meta.mjs check artifacts/cd-npm-cli-meta/release.json packages/cli/release/package.json
      # No Preview environment: this publish must not wait for a reviewer.
      # Repository NPM_TOKEN when set; otherwise OIDC trusted publishing.
      - uses: ./.github/actions/publish-npm-package
        with:
          working-directory: packages/cli/release
          npm-dist-tag: ${{ needs.stage.outputs.npm_dist_tag }}
          npm-token: ${{ secrets.NPM_TOKEN }}

  preview_smoke:
    name: Preview npm smoke
    needs: [stage, preview]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            scripts/lib
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - name: Prove alpha npm resolves and runs
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
          NPM_PACKAGE_NAME: "@opensesame-labs/cli"
          NPM_DIST_TAG: alpha
        run: node scripts/release/cd-preview-smoke.mjs

  production:
    name: Production npm publish
    needs: [stage, preview, preview_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: Production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-cli-release-${{ github.run_id }}
          path: packages/cli/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cd-npm-cli-meta-${{ github.run_id }}
          path: artifacts/cd-npm-cli-meta
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - name: Require the staged metadata
        env:
          EXPECTED_VERSION: ${{ needs.stage.outputs.version }}
        run: node scripts/release/cd-release-meta.mjs check artifacts/cd-npm-cli-meta/release.json packages/cli/release/package.json
      - uses: ./.github/actions/publish-npm-package
        with:
          working-directory: packages/cli/release
          npm-dist-tag: next
          npm-token: ""

  promotion_failed:
    name: Promotion blocked notice
    needs: [main_ci, stage, preview, preview_smoke, production]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node@24
      - name: Notify that promotion was blocked
        env:
          PROMOTION_FAIL_REASON: Automated CLI CD promotion stopped because a gate failed (main CI, preview publish, preview smoke, or Production dist-tag).
        run: node scripts/release/cd-promotion-notify.mjs

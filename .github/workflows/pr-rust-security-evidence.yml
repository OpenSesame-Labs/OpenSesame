# Trusted, manually dispatched Rust regressions for security patches whose
# protected-source ledger intentionally cannot be refreshed before the tests.
name: PR Rust security evidence

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Main-targeted same-repository pull request number
        required: true
        type: string
      suite:
        description: Reviewed hardcoded regression matrix
        required: true
        type: choice
        options:
          - receipt-owner-mapping

permissions: {}

jobs:
  evidence:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_VISUAL_NUMBER: ${{ inputs.pull_request }}
      PR_VISUAL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_VISUAL_BASE_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out the trusted controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve a current same-repository PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR_VISUAL_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]]
          [[ "$PR_VISUAL_DEFAULT_BRANCH" =~ ^[A-Za-z0-9._-]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_VISUAL_NUMBER" > "$RUNNER_TEMP/pr-rust-pull.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_VISUAL_DEFAULT_BRANCH" > "$RUNNER_TEMP/pr-rust-branch.json"
          node base/scripts/ci/pr-visual-ref.mjs "$RUNNER_TEMP/pr-rust-pull.json" "$RUNNER_TEMP/pr-rust-branch.json"
      - name: Check out the exact PR head without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          path: head
          persist-credentials: false
          fetch-depth: 1
      - name: Install the trusted pinned Rust toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: base
          install_args: rust
          cache: false
          cache_save: false
          persist_github_token: false
      - name: Run the hardcoded exact-head security matrix
        working-directory: head
        env:
          PR_RUST_EVIDENCE_LOG_DIR: ${{ runner.temp }}/pr-rust-security-evidence
        run: bash ../base/scripts/ci/pr-rust-security-evidence.sh "${{ inputs.suite }}"
      - name: Recheck both revisions before retaining evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_VISUAL_EXPECTED_HEAD: ${{ steps.resolve.outputs.head_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_VISUAL_NUMBER" > "$RUNNER_TEMP/pr-rust-pull-current.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_VISUAL_DEFAULT_BRANCH" > "$RUNNER_TEMP/pr-rust-branch-current.json"
          node base/scripts/ci/pr-visual-ref.mjs "$RUNNER_TEMP/pr-rust-pull-current.json" "$RUNNER_TEMP/pr-rust-branch-current.json"
      - name: Retain exact-head test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-rust-security-${{ inputs.pull_request }}-${{ inputs.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-rust-security-evidence/
          retention-days: 14
          if-no-files-found: error

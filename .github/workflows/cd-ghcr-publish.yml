# Publish OpenSesame images to ghcr.io/opensesame-labs.
# Push to main and v* tags only. workflow_dispatch on other refs builds locally
# (push: false, load + oci-image-smoke) as a proof run. Not part of ci.yml.
# Do not revive .github/workflows/publish-containers.yml.
#
# One matrix row builds one image and one platform, with a 10 minute cap.
# GitHub Actions layer cache is scoped per row. linux/arm64 rows run on
# ubuntu-24.04-arm (no QEMU). opensesame is linux/amd64 and linux/arm64.
# web-pwa is outside that matrix. web-pwa-tailscale-wasm prepares pinned native
# distributions on amd64 once; web-pwa-amd64 and publish web-pwa-arm64 download
# that artifact before Docker (slice 2). Publish web-pwa-arm64 still does not wait on amd64.
# When PUBLISH_GHCR is not true, web-pwa-arm64-proof needs web-pwa-amd64:
# amd64 saves web-pwa:local and uploads artifact web-pwa-amd64-runtime;
# the proof job downloads it, docker-loads it, and builds target
# runtime-from-prebuilt with the docker driver so that tag is the loaded
# image. Publish runs keep the ghcr primary tag and the container driver.
# This file installs no QEMU. A cold cache can still miss the cap; retry
# with workflow_dispatch.
# The manifest job publishes :next / :sha-* (or semver tags) from the
# platform images.
#
# Login uses GITHUB_TOKEN. Optional override, not wired here: set
# GHCR_PUBLISH_TOKEN on the container-release environment (main and v* tags)
# and replace the login password. An editable workflow cannot enforce the
# package ACL by itself.
name: CD GHCR publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ops/containers/**"
      - "ops/compose/Dockerfile"
      - ".github/workflows/cd-ghcr-publish.yml"

permissions:
  contents: read
  packages: write
  # type=gha cache writes go through the Actions cache API.
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: cd-ghcr-publish
  cancel-in-progress: false

jobs:
  web-pwa-tailscale-wasm:
    name: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            tools
            scripts
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Prepare pinned Tailscale native distributions
        run: node --input-type=module -e 'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  images:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      PUBLISH_GHCR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: opensesame-amd64
            name: opensesame
            file: ops/compose/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: opensesame-arm64
            name: opensesame
            file: ops/compose/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - id: cli-amd64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: cli-arm64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - id: control-plane-amd64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: control-plane-arm64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Check Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [[ -f "${{ matrix.file }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.file }} is absent on this revision; skipping ${{ matrix.id }}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
          PUBLISH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GHCR}" != "true" ]]; then
            {
              echo "version=0.0.0-local"
              echo "primary=${IMAGE_NAME}:local"
              echo "list<<EOF"
              printf '%s\n' "${IMAGE_NAME}:local"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          arch="${PLATFORM#linux/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            primary="${image}:${version}-${arch}"
          else
            version="0.0.0-next"
            primary="${image}:sha-${GITHUB_SHA}-${arch}"
          fi
          {
            echo "version=${version}"
            echo "primary=${primary}"
            echo "list<<EOF"
            printf '%s\n' "${primary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional override: password: ${{ secrets.GHCR_PUBLISH_TOKEN }} from
      # the container-release environment. Default remains GITHUB_TOKEN.
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ env.PUBLISH_GHCR == 'true' }}
          load: ${{ env.PUBLISH_GHCR != 'true' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: ${{ env.PUBLISH_GHCR == 'true' }}
          sbom: false
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: node scripts/ci/oci-image-smoke.mjs ${{ matrix.name }}:local

  # id: web-pwa-amd64
  web-pwa-amd64:
    name: web-pwa-amd64
    needs: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      primary: ${{ steps.tags.outputs.primary }}
      version: ${{ steps.tags.outputs.version }}
    env:
      PUBLISH_GHCR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore

      - name: Restore prepared Tailscale WASM distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/containers/web-pwa/Dockerfile
          IMAGE_ID: web-pwa-amd64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: web-pwa
          PLATFORM: linux/amd64
          PUBLISH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GHCR}" != "true" ]]; then
            {
              echo "version=0.0.0-local"
              echo "primary=${IMAGE_NAME}:local"
              echo "list<<EOF"
              printf '%s\n' "${IMAGE_NAME}:local"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          arch="${PLATFORM#linux/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            primary="${image}:${version}-${arch}"
          else
            version="0.0.0-next"
            primary="${image}:sha-${GITHUB_SHA}-${arch}"
          fi
          {
            echo "version=${version}"
            echo "primary=${primary}"
            echo "list<<EOF"
            printf '%s\n' "${primary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional override: password: ${{ secrets.GHCR_PUBLISH_TOKEN }} from
      # the container-release environment. Default remains GITHUB_TOKEN.
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/containers/web-pwa/Dockerfile
          target: runtime
          push: ${{ env.PUBLISH_GHCR == 'true' }}
          load: ${{ env.PUBLISH_GHCR != 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: ${{ env.PUBLISH_GHCR == 'true' }}
          sbom: false
          cache-from: type=gha,scope=web-pwa-amd64
          cache-to: type=gha,mode=max,scope=web-pwa-amd64

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: node scripts/ci/oci-image-smoke.mjs web-pwa:local

      - name: Export amd64 runtime image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: docker save -o web-pwa-amd64-runtime.tar web-pwa:local

      - name: Upload amd64 runtime image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pwa-amd64-runtime
          path: web-pwa-amd64-runtime.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Publish path. No needs: runs in parallel with web-pwa-amd64.
  # target runtime on ubuntu-24.04-arm, same sparse checkout as web-pwa-amd64.
  # Cache scope is web-pwa-arm64 only. Build-args are VERSION only.
  web-pwa-arm64:
    name: web-pwa-arm64
    needs: web-pwa-tailscale-wasm
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      PUBLISH_GHCR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore

      - name: Restore prepared Tailscale WASM distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/containers/web-pwa/Dockerfile
          IMAGE_ID: web-pwa-arm64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: web-pwa
          PLATFORM: linux/arm64
          PUBLISH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GHCR}" != "true" ]]; then
            {
              echo "version=0.0.0-local"
              echo "primary=${IMAGE_NAME}:local"
              echo "list<<EOF"
              printf '%s\n' "${IMAGE_NAME}:local"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          arch="${PLATFORM#linux/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            primary="${image}:${version}-${arch}"
          else
            version="0.0.0-next"
            primary="${image}:sha-${GITHUB_SHA}-${arch}"
          fi
          {
            echo "version=${version}"
            echo "primary=${primary}"
            echo "list<<EOF"
            printf '%s\n' "${primary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional override: password: ${{ secrets.GHCR_PUBLISH_TOKEN }} from
      # the container-release environment. Default remains GITHUB_TOKEN.
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/containers/web-pwa/Dockerfile
          target: runtime
          push: ${{ env.PUBLISH_GHCR == 'true' }}
          load: ${{ env.PUBLISH_GHCR != 'true' }}
          platforms: linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: ${{ env.PUBLISH_GHCR == 'true' }}
          sbom: false
          cache-from: type=gha,scope=web-pwa-arm64
          cache-to: type=gha,mode=max,scope=web-pwa-arm64

  # id: web-pwa-arm64
  # Non-publish proof on ubuntu-24.04-arm. No QEMU action:
  # runtime-from-prebuilt only copies PREBUILT_IMAGE; it does not emulate.
  # This job does not run on main or v* tags, so publish does not wait on
  # amd64. It loads artifact web-pwa-amd64-runtime before Build.
  # The docker driver reads that engine image as web-pwa:local.
  web-pwa-arm64-proof:
    name: web-pwa-arm64-proof
    if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: web-pwa-amd64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      PUBLISH_GHCR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/containers/web-pwa/Dockerfile
            scripts/ci

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/containers/web-pwa/Dockerfile
          IMAGE_ID: web-pwa-arm64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: web-pwa
          PLATFORM: linux/arm64
          PUBLISH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GHCR}" != "true" ]]; then
            {
              echo "version=0.0.0-local"
              echo "primary=${IMAGE_NAME}:local"
              echo "list<<EOF"
              printf '%s\n' "${IMAGE_NAME}:local"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          arch="${PLATFORM#linux/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            primary="${image}:${version}-${arch}"
          else
            version="0.0.0-next"
            primary="${image}:sha-${GITHUB_SHA}-${arch}"
          fi
          {
            echo "version=${version}"
            echo "primary=${primary}"
            echo "list<<EOF"
            printf '%s\n' "${primary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional override: password: ${{ secrets.GHCR_PUBLISH_TOKEN }} from
      # the container-release environment. Default remains GITHUB_TOKEN.
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # Publish keeps the container driver so type=gha cache export works.
          # Non-publish uses the docker driver, which sees `docker load`.
          driver: ${{ env.PUBLISH_GHCR == 'true' && 'docker-container' || 'docker' }}

      - name: Require amd64 prebuilt image
        if: steps.dockerfile.outputs.present == 'true'
        env:
          PREBUILT_IMAGE: ${{ needs['web-pwa-amd64'].outputs.primary }}
        run: |
          set -euo pipefail
          if [[ -z "${PREBUILT_IMAGE}" ]]; then
            echo "::error::web-pwa-arm64 needs a non-empty web-pwa-amd64 primary tag for PREBUILT_IMAGE"
            exit 1
          fi

      - name: Download amd64 runtime image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-pwa-amd64-runtime
          path: .

      - name: Load amd64 runtime image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: docker load -i web-pwa-amd64-runtime.tar

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/containers/web-pwa/Dockerfile
          target: runtime-from-prebuilt
          push: ${{ env.PUBLISH_GHCR == 'true' }}
          load: ${{ env.PUBLISH_GHCR != 'true' }}
          platforms: linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ needs['web-pwa-amd64'].outputs.version }}
            PREBUILT_IMAGE=${{ needs['web-pwa-amd64'].outputs.primary }}
          provenance: ${{ env.PUBLISH_GHCR == 'true' }}
          sbom: false
          cache-from: |
            type=gha,scope=web-pwa-amd64
            type=gha,scope=web-pwa-arm64
          cache-to: type=gha,mode=max,scope=web-pwa-arm64

      - name: Build
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/containers/web-pwa/Dockerfile
          target: runtime-from-prebuilt
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ needs['web-pwa-amd64'].outputs.version }}
            PREBUILT_IMAGE=${{ needs['web-pwa-amd64'].outputs.primary }}
          provenance: false
          sbom: false

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: node scripts/ci/oci-image-smoke.mjs web-pwa:local

  manifests:
    name: Manifest ${{ matrix.name }}
    needs: [images, web-pwa-tailscale-wasm, web-pwa-amd64, web-pwa-arm64]
    if: needs.images.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs['web-pwa-amd64'].result == 'success' && needs['web-pwa-arm64'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opensesame
            file: ops/compose/Dockerfile
            platforms: amd64 arm64
          - name: cli
            file: ops/containers/cli/Dockerfile
            platforms: amd64 arm64
          - name: web-pwa
            file: ops/containers/web-pwa/Dockerfile
            platforms: amd64 arm64
          - name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platforms: amd64 arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/compose/Dockerfile
            /ops/containers/cli/Dockerfile
            /ops/containers/web-pwa/Dockerfile
            /ops/containers/control-plane/Dockerfile
      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Publish manifest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.file }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          if [[ ! -f "${DOCKERFILE}" ]]; then
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_NAME}"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          sources=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            canonical=("${image}:${version}" "${image}:latest")
            for arch in ${PLATFORMS}; do
              sources+=("${image}:${version}-${arch}")
            done
          else
            canonical=("${image}:next" "${image}:sha-${GITHUB_SHA}")
            for arch in ${PLATFORMS}; do
              sources+=("${image}:sha-${GITHUB_SHA}-${arch}")
            done
          fi
          for source in "${sources[@]}"; do
            docker buildx imagetools inspect "${source}" >/dev/null
          done
          args=()
          for tag in "${canonical[@]}"; do
            args+=(-t "${tag}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

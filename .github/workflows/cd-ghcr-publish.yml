# Build and smoke container images without registry publication. The current
# qualified candidate inventory has no OCI artifacts; main, tags, and manual
# dispatch must not bypass that qualification by rebuilding and pushing images.
# Restore publication only through qualified digest-bound OCI promotion and a
# separately protected container-release credential and registry package ACL.
# schedule runs on default branch only, proof-only (publication-disabled), no registry push.
# The cron refreshes ghcr-opensesame-amd64-musl before the 7-day GitHub Actions cache TTL.
name: GHCR image build proof

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 */3 * *"  # every 3 days, 11:17 UTC (off :00); tolerates one missed run under 7-day TTL
  push:
    branches: [main]
    paths:
      - "ops/containers/**"
      - "ops/compose/Dockerfile"
      - ".github/workflows/cd-ghcr-publish.yml"

permissions: {}

# Cancel only an older proof for the same ref.
concurrency:
  group: ghcr-image-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-pwa-tailscale-wasm:
    name: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            tools
            scripts
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /patches/vendor
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node
        run: bash scripts/lib/install-mise-locked.sh node
      - run: npm ci --ignore-scripts
      - name: Restore the pinned native PWA distribution
        id: native_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Prepare pinned Tailscale native distributions
        run: node --input-type=module -e 'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # Only a verified successful main build may seed the shared cache. Manual
      # dispatches from other refs can restore main's cache but cannot save.
      - name: Save the pinned native PWA distribution
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}

  opensesame-amd64-rust:
    name: opensesame-amd64-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # rust-cache saves through the Actions cache API.
    # The mise tool directory is restored read-only and is not saved.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
            /.cargo/config.toml
      - name: Install Linux keychain build dependencies
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - name: Install musl toolchain
        run: bash scripts/ci/prepare-musl.sh "$RUNNER_TEMP/opensesame-musl"
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-rust-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-rust-
            mise-v1-linux-
      - name: Install pinned mise and Rust
        run: bash scripts/lib/install-mise-locked.sh rust
      # mise.toml sets CARGO_TARGET_DIR=$HOME/.cache/packages/cargo-target.
      # rust-cache v2 joins `workspaces` `$target` onto the workspace root, so
      # the target is the relative path from $GITHUB_WORKSPACE
      # ($HOME/work/<owner>/<repo>) to that directory.
      # Save ghcr-opensesame-amd64-musl only on main, and only for push,
      # workflow_dispatch, and schedule. A branch workflow_dispatch restores
      # the key and does not save, so it cannot replace the shared blob.
      # cache-on-failure saves this shared key when the build fails.
      # cache-all-crates keeps dependency crates. The schedule refreshes the
      # key before the 7-day GitHub Actions cache TTL. The musl suffix drops
      # the previous gnu target cache; those objects do not build this triple.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache-ghcr
        with:
          prefix-key: v0-rust
          shared-key: ghcr-opensesame-amd64-musl
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
          workspaces: . -> ../../../.cache/packages/cargo-target
      - name: Log Rust cache hit
        env:
          CACHE_NAME: rust-ghcr
          CACHE_HIT: ${{ steps.rust-cache-ghcr.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.rust-cache-ghcr.outputs.cache-primary-key }}
          CACHE_PRIMARY_KEY: v0-rust-ghcr-opensesame-amd64-musl
          CACHE_PRIMARY_IS_PREFIX: "true"
          MAIN_SEED_PREFIX: v0-rust-ghcr-opensesame-amd64-musl-
        run: |
          export CACHE_PROBE_DIR="${HOME}/.cargo/registry/cache"
          node scripts/lib/ci-cache-seed.mjs
      # Alpine runs this binary. mold links the gnu target only and breaks
      # musl-gcc. prepare-musl.sh puts musl-gcc on PATH for this step.
      - name: Build opensesame release binary
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          source "$RUNNER_TEMP/opensesame-musl/env.sh"
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p opensesame-cli --bin opensesame --target x86_64-unknown-linux-musl
      # mise.toml CARGO_TARGET_DIR is outside the workspace. Upload the musl
      # release binary. rust-cache above restores the same directory.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensesame-amd64-binary
          path: ${{ env.CARGO_TARGET_DIR }}/x86_64-unknown-linux-musl/release/opensesame
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  images:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The Actions cache is the only write required by image proofs.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cli-amd64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: cli-arm64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - id: control-plane-amd64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: control-plane-arm64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: CLI shrinkwrap matches publish manifest
        if: matrix.name == 'cli'
        run: node scripts/release/cli-shrinkwrap.mjs check
      - name: Check Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [[ -f "${{ matrix.file }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.file }} is absent on this revision; skipping ${{ matrix.id }}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          echo "version=0.0.0-local" >> "$GITHUB_OUTPUT"
          printf 'list=%s:local\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true'
        run: node scripts/ci/oci-image-smoke.mjs ${{ matrix.name }}:local

  opensesame-amd64:
    name: opensesame-amd64
    needs: opensesame-amd64-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Actions cache is the only write required by image proofs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Download prebuilt opensesame binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opensesame-amd64-binary
          path: ops/compose/prebuilt
      - name: Check prebuilt opensesame binary
        run: |
          set -euo pipefail
          test -f ops/compose/prebuilt/opensesame
          chmod 0755 ops/compose/prebuilt/opensesame

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/compose/Dockerfile
          IMAGE_ID: opensesame-amd64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: opensesame
        run: |
          set -euo pipefail
          echo "version=0.0.0-local" >> "$GITHUB_OUTPUT"
          printf 'list=%s:local\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/compose/Dockerfile
          target: runtime-from-prebuilt
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=opensesame-amd64
          cache-to: type=gha,mode=max,scope=opensesame-amd64

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true'
        run: node scripts/ci/oci-image-smoke.mjs opensesame:local

  # id: web-pwa-amd64
  web-pwa-amd64:
    name: web-pwa-amd64
    needs: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Actions cache is the only write required by image proofs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /.gitignore
            /tsconfig.base.json
            /.env.schema
            /.dockerignore

      - name: Restore prepared Tailscale WASM distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/containers/web-pwa/Dockerfile
          IMAGE_ID: web-pwa-amd64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: web-pwa
        run: |
          set -euo pipefail
          echo "version=0.0.0-local" >> "$GITHUB_OUTPUT"
          printf 'list=%s:local\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/containers/web-pwa/Dockerfile
          target: runtime
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web-pwa-amd64
          cache-to: type=gha,mode=max,scope=web-pwa-amd64

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true'
        run: node scripts/ci/oci-image-smoke.mjs web-pwa:local

  publication-disabled:
    name: GHCR publication disabled
    if: always()
    needs: [images, opensesame-amd64, web-pwa-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Explain the publication boundary
        run: echo "::notice::Images are proof-only; publishing requires qualified OCI candidates and independent registry controls."

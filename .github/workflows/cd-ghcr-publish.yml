# Build and smoke container images without registry publication. The current
# qualified candidate inventory has no OCI artifacts; main, tags, and manual
# dispatch must not bypass that qualification by rebuilding and pushing images.
# Restore publication only through qualified digest-bound OCI promotion and a
# separately protected container-release credential and registry package ACL.
name: GHCR image build proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/containers/**"
      - "ops/compose/Dockerfile"
      - ".github/workflows/cd-ghcr-publish.yml"

permissions: {}

# Cancel only an older proof for the same ref.
concurrency:
  group: ghcr-image-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-pwa-tailscale-wasm:
    name: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            tools
            scripts
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /patches/vendor
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-node-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-node-
            mise-v1-linux-
      - name: Install pinned mise and Node
        run: bash scripts/lib/install-mise-locked.sh node
      - run: npm ci --ignore-scripts
      - name: Prepare pinned Tailscale native distributions
        run: node --input-type=module -e 'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  opensesame-amd64-rust:
    name: opensesame-amd64-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # rust-cache saves through the Actions cache API.
    # The mise tool directory is restored read-only and is not saved.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Install Linux keychain build dependencies
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - name: Restore mise tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-v2-${{ runner.os }}-rust-lock-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-v2-${{ runner.os }}-seed-main-rust-
            mise-v1-linux-
      - name: Install pinned mise and Rust
        run: bash scripts/lib/install-mise-locked.sh rust
      # mise.toml sets CARGO_TARGET_DIR=$HOME/.cache/packages/cargo-target.
      # rust-cache v2 joins `workspaces` `$target` onto the workspace root, so
      # the target is the relative path from $GITHUB_WORKSPACE
      # ($HOME/work/<owner>/<repo>) to that directory.
      # ci.yml rust-build saves shared-key rust-build-<arch> into that target.
      # save-if false restores the trunk key without replacing it on publish.
      # A miss on the GHCR key below is a cold release compile (~9m) that
      # exceeds this job's 10 minute limit.
      - name: Restore trunk Rust compile cache
        id: rust-cache-trunk
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v0-rust
          shared-key: rust-build-${{ runner.arch }}
          save-if: false
          workspaces: . -> ../../../.cache/packages/cargo-target
      # Save on workflow_dispatch and on push to main. Tag pushes restore only.
      # refs/heads/main keeps ghcr-opensesame-amd64. Any other ref uses a
      # run-scoped key so a branch proof cannot replace the main blob.
      # cache-on-failure saves this shared key when the build fails.
      # cache-all-crates keeps dependency crates. The registry is reusable
      # when the trunk target cache has already warmed those deps.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache-ghcr
        with:
          prefix-key: v0-rust
          shared-key: ${{ github.ref == 'refs/heads/main' && 'ghcr-opensesame-amd64' || format('ghcr-opensesame-amd64-proof-{0}', github.run_id) }}
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
          workspaces: . -> ../../../.cache/packages/cargo-target
      - name: Log Rust cache hit
        env:
          CACHE_NAME: rust-ghcr
          CACHE_HIT: ${{ steps.rust-cache-ghcr.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: v0-rust-${{ github.ref == 'refs/heads/main' && 'ghcr-opensesame-amd64' || format('ghcr-opensesame-amd64-proof-{0}', github.run_id) }}
          MAIN_SEED_PREFIX: v0-rust-rust-build-${{ runner.arch }}-,v0-rust-ghcr-opensesame-amd64-
        run: |
          export CACHE_PROBE_DIR="${HOME}/.cargo/registry/cache"
          node scripts/lib/ci-cache-seed.mjs
      - name: Log trunk Rust cache restore
        env:
          CACHE_NAME: rust-trunk
          CACHE_HIT: ${{ steps.rust-cache-trunk.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: v0-rust-rust-build-${{ runner.arch }}
          MAIN_SEED_PREFIX: v0-rust-rust-build-${{ runner.arch }}-
        run: |
          export CACHE_PROBE_DIR="${HOME}/.cargo/registry/cache"
          node scripts/lib/ci-cache-seed.mjs
      # Hosted Ubuntu provides clang. mold is not on the image. Fetch whichever
      # is missing into the runner temp, without changing system packages.
      - name: Install mold and clang
        run: |
          set -euo pipefail
          if command -v mold >/dev/null && command -v clang >/dev/null; then
            ld_mold=$(command -v ld.mold)
            ldd "$ld_mold" >/dev/null
            "$ld_mold" --version >/dev/null
            exit 0
          fi
          link_root="${RUNNER_TEMP}/opensesame-link"
          mkdir -p "$link_root"/{lists/partial,cache/archives/partial,conf.d,log,packages,sysroot,bin}
          printf 'Dir::Etc::parts "%s/conf.d";\n#clear APT::Update::Post-Invoke;\n#clear APT::Update::Post-Invoke-Success;\n' \
            "$link_root" > "$link_root/apt.conf"
          apt_options=(
            -c "$link_root/apt.conf"
            -o "Dir::State::lists=$link_root/lists"
            -o "Dir::Cache=$link_root/cache"
            -o "Dir::Cache::archives=$link_root/packages"
            -o "Dir::Log=$link_root/log"
            -o "Dir::Etc::parts=$link_root/conf.d"
            -o "APT::Sandbox::User=$(id -un)"
            -o "Debug::NoLocking=1"
            -o "APT::Get::Download-Only=true"
            -o "APT::Get::AllowUnauthenticated=false"
            -o "Acquire::AllowInsecureRepositories=false"
          )
          missing=()
          command -v mold >/dev/null || missing+=(mold)
          command -v clang >/dev/null || missing+=(clang)
          APT_CONFIG="$link_root/apt.conf" apt-get "${apt_options[@]}" update
          APT_CONFIG="$link_root/apt.conf" apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
          for archive in "$link_root/packages/"*.deb; do
            dpkg-deb --extract "$archive" "$link_root/sysroot"
          done
          for tool in mold ld.mold clang; do
            if [[ -e "$link_root/sysroot/usr/bin/$tool" ]]; then
              cp -a "$link_root/sysroot/usr/bin/$tool" "$link_root/bin/"
            fi
          done
          for extra in "$link_root/sysroot/usr/bin"/clang-*; do
            [[ -e "$extra" ]] || continue
            cp -a "$extra" "$link_root/bin/"
          done
          # Apt mold links libmimalloc from the extracted debs. Export those
          # directories whenever the linker was copied, even if clang is present.
          if [[ -e "$link_root/bin/ld.mold" || -e "$link_root/bin/mold" ]] || ! command -v clang >/dev/null; then
            lib_dirs=()
            for dir in "$link_root/sysroot/usr/lib/"* "$link_root/sysroot/lib/"*; do
              [[ -d "$dir" ]] || continue
              lib_dirs+=("$dir")
            done
            if ((${#lib_dirs[@]} > 0)); then
              joined=$(IFS=:; echo "${lib_dirs[*]}")
              echo "LD_LIBRARY_PATH=${joined}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
              export LD_LIBRARY_PATH="${joined}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            fi
          fi
          if compgen -G "$link_root/bin/*" >/dev/null; then
            echo "$link_root/bin" >> "$GITHUB_PATH"
          fi
          if command -v mold >/dev/null; then
            command -v ld.mold >/dev/null
            ldd "$(command -v ld.mold)" >/dev/null
            ld.mold --version >/dev/null
          else
            test -x "$link_root/bin/mold"
            test -e "$link_root/bin/ld.mold"
            ldd "$link_root/bin/ld.mold" >/dev/null
            "$link_root/bin/ld.mold" --version >/dev/null
          fi
          if ! command -v clang >/dev/null; then
            test -e "$link_root/bin/clang"
          fi
      - name: Build opensesame release binary
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          cargo build --release --locked -p opensesame-cli --bin opensesame
      # mise.toml CARGO_TARGET_DIR is outside the workspace. Upload that
      # release binary. rust-cache above restores the same directory.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensesame-amd64-binary
          path: ${{ env.CARGO_TARGET_DIR }}/release/opensesame
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  images:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The Actions cache is the only write required by image proofs.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cli-amd64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: cli-arm64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - id: control-plane-amd64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: control-plane-arm64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: CLI shrinkwrap matches publish manifest
        if: matrix.name == 'cli'
        run: node scripts/release/cli-shrinkwrap.mjs check
      - name: Check Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [[ -f "${{ matrix.file }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.file }} is absent on this revision; skipping ${{ matrix.id }}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          echo "version=0.0.0-local" >> "$GITHUB_OUTPUT"
          printf 'list=%s:local\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true'
        run: node scripts/ci/oci-image-smoke.mjs ${{ matrix.name }}:local

  opensesame-amd64:
    name: opensesame-amd64
    needs: opensesame-amd64-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Actions cache is the only write required by image proofs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Download prebuilt opensesame binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opensesame-amd64-binary
          path: ops/compose/prebuilt
      - name: Check prebuilt opensesame binary
        run: |
          set -euo pipefail
          test -f ops/compose/prebuilt/opensesame
          chmod 0755 ops/compose/prebuilt/opensesame

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/compose/Dockerfile
          IMAGE_ID: opensesame-amd64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: opensesame
        run: |
          set -euo pipefail
          echo "version=0.0.0-local" >> "$GITHUB_OUTPUT"
          printf 'list=%s:local\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/compose/Dockerfile
          target: runtime-from-prebuilt
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=opensesame-amd64
          cache-to: type=gha,mode=max,scope=opensesame-amd64

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true'
        run: node scripts/ci/oci-image-smoke.mjs opensesame:local

  # id: web-pwa-amd64
  web-pwa-amd64:
    name: web-pwa-amd64
    needs: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Actions cache is the only write required by image proofs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /.gitignore
            /tsconfig.base.json
            /.env.schema
            /.dockerignore

      - name: Restore prepared Tailscale WASM distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/containers/web-pwa/Dockerfile
          IMAGE_ID: web-pwa-amd64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: web-pwa
        run: |
          set -euo pipefail
          echo "version=0.0.0-local" >> "$GITHUB_OUTPUT"
          printf 'list=%s:local\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/containers/web-pwa/Dockerfile
          target: runtime
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web-pwa-amd64
          cache-to: type=gha,mode=max,scope=web-pwa-amd64

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true'
        run: node scripts/ci/oci-image-smoke.mjs web-pwa:local

  publication-disabled:
    name: GHCR publication disabled
    if: always()
    needs: [images, opensesame-amd64, web-pwa-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Explain the publication boundary
        run: echo "::notice::Images are proof-only; publishing requires qualified OCI candidates and independent registry controls."

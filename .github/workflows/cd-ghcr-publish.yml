# Publish OpenSesame images to ghcr.io/opensesame-labs.
# Push to main and v* tags only. workflow_dispatch on other refs builds locally
# (push: false, load + oci-image-smoke) as a proof run. Not part of ci.yml.
# Do not revive .github/workflows/publish-containers.yml.
#
# One matrix row builds one image and one platform, with a 10 minute cap.
# GitHub Actions layer cache is scoped per row. linux/arm64 rows run on
# ubuntu-24.04-arm (no QEMU). opensesame is outside that matrix and is
# linux/amd64 only: opensesame-amd64-rust compiles the host binary on the
# runner with Swatinem/rust-cache, and opensesame-amd64 builds
# runtime-from-prebuilt from that artifact. Its layer cache scope is
# opensesame-amd64.
# web-pwa is outside that matrix and is linux/amd64 only, same as opensesame,
# so a cold image build stays under the 10 minute cap.
# web-pwa-tailscale-wasm prepares pinned native distributions on amd64 once;
# web-pwa-amd64 downloads that artifact before Docker.
# This file installs no QEMU. A cold cache can still miss the cap; retry
# with workflow_dispatch.
# The manifest job publishes :next / :sha-* (or semver tags) from the
# platform images.
#
# Login uses GITHUB_TOKEN. Optional override, not wired here: set
# GHCR_PUBLISH_TOKEN on the container-release environment (main and v* tags)
# and replace the login password. An editable workflow cannot enforce the
# package ACL by itself.
name: CD GHCR publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ops/containers/**"
      - "ops/compose/Dockerfile"
      - ".github/workflows/cd-ghcr-publish.yml"

permissions:
  contents: read
  packages: write
  # type=gha cache writes go through the Actions cache API.
  actions: write
  id-token: write
  attestations: write

# Prod (push to main, v* tags, and workflow_dispatch on main) shares
# cd-ghcr-publish-prod-<ref> and cancels an older run of that ref. Branch
# proof dispatches use cd-ghcr-publish-dispatch-<ref> and do not block prod.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('cd-ghcr-publish-dispatch-{0}', github.ref) || format('cd-ghcr-publish-prod-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  web-pwa-tailscale-wasm:
    name: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            tools
            scripts
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: node
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Prepare pinned Tailscale native distributions
        run: node --input-type=module -e 'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  opensesame-amd64-rust:
    name: opensesame-amd64-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Install Linux keychain build dependencies
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: rust
      # Save on workflow_dispatch and on push to main. Tag pushes restore only.
      # cache-on-failure saves this shared key when the build fails.
      # mise.toml sets CARGO_TARGET_DIR=$HOME/.cache/packages/cargo-target.
      # rust-cache v2 joins `workspaces` `$target` onto the workspace root, so
      # the target is the relative path from $GITHUB_WORKSPACE
      # ($HOME/work/<owner>/<repo>) to that directory.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v0-rust
          shared-key: ghcr-opensesame-amd64
          cache-on-failure: true
          save-if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
          workspaces: . -> ../../../.cache/packages/cargo-target
      # Hosted Ubuntu provides clang. mold is not on the image. Fetch whichever
      # is missing into the runner temp, without changing system packages.
      - name: Install mold and clang
        run: |
          set -euo pipefail
          if command -v mold >/dev/null && command -v clang >/dev/null; then
            exit 0
          fi
          link_root="${RUNNER_TEMP}/opensesame-link"
          mkdir -p "$link_root"/{lists/partial,cache/archives/partial,conf.d,log,packages,sysroot,bin}
          printf 'Dir::Etc::parts "%s/conf.d";\n#clear APT::Update::Post-Invoke;\n#clear APT::Update::Post-Invoke-Success;\n' \
            "$link_root" > "$link_root/apt.conf"
          apt_options=(
            -c "$link_root/apt.conf"
            -o "Dir::State::lists=$link_root/lists"
            -o "Dir::Cache=$link_root/cache"
            -o "Dir::Cache::archives=$link_root/packages"
            -o "Dir::Log=$link_root/log"
            -o "Dir::Etc::parts=$link_root/conf.d"
            -o "APT::Sandbox::User=$(id -un)"
            -o "Debug::NoLocking=1"
            -o "APT::Get::Download-Only=true"
            -o "APT::Get::AllowUnauthenticated=false"
            -o "Acquire::AllowInsecureRepositories=false"
          )
          missing=()
          command -v mold >/dev/null || missing+=(mold)
          command -v clang >/dev/null || missing+=(clang)
          APT_CONFIG="$link_root/apt.conf" apt-get "${apt_options[@]}" update
          APT_CONFIG="$link_root/apt.conf" apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
          for archive in "$link_root/packages/"*.deb; do
            dpkg-deb --extract "$archive" "$link_root/sysroot"
          done
          for tool in mold ld.mold clang; do
            if [[ -e "$link_root/sysroot/usr/bin/$tool" ]]; then
              cp -a "$link_root/sysroot/usr/bin/$tool" "$link_root/bin/"
            fi
          done
          for extra in "$link_root/sysroot/usr/bin"/clang-*; do
            [[ -e "$extra" ]] || continue
            cp -a "$extra" "$link_root/bin/"
          done
          if ! command -v clang >/dev/null; then
            lib_dirs=()
            for dir in "$link_root/sysroot/usr/lib/"* "$link_root/sysroot/lib/"*; do
              [[ -d "$dir" ]] || continue
              lib_dirs+=("$dir")
            done
            if ((${#lib_dirs[@]} > 0)); then
              joined=$(IFS=:; echo "${lib_dirs[*]}")
              echo "LD_LIBRARY_PATH=${joined}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            fi
          fi
          if compgen -G "$link_root/bin/*" >/dev/null; then
            echo "$link_root/bin" >> "$GITHUB_PATH"
          fi
          if command -v mold >/dev/null; then
            command -v ld.mold >/dev/null
          else
            test -x "$link_root/bin/mold"
            test -e "$link_root/bin/ld.mold"
          fi
          if ! command -v clang >/dev/null; then
            test -e "$link_root/bin/clang"
          fi
      - name: Build opensesame release binary
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          cargo build --release --locked -p opensesame-cli --bin opensesame
      # mise.toml CARGO_TARGET_DIR is outside the workspace. Upload that
      # release binary. rust-cache above restores the same directory.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensesame-amd64-binary
          path: ${{ env.CARGO_TARGET_DIR }}/release/opensesame
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  images:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      PUBLISH_GHCR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cli-amd64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: cli-arm64
            name: cli
            file: ops/containers/cli/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - id: control-plane-amd64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - id: control-plane-arm64
            name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Check Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [[ -f "${{ matrix.file }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.file }} is absent on this revision; skipping ${{ matrix.id }}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
          PUBLISH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GHCR}" != "true" ]]; then
            {
              echo "version=0.0.0-local"
              echo "primary=${IMAGE_NAME}:local"
              echo "list<<EOF"
              printf '%s\n' "${IMAGE_NAME}:local"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          arch="${PLATFORM#linux/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            primary="${image}:${version}-${arch}"
          else
            version="0.0.0-next"
            primary="${image}:sha-${GITHUB_SHA}-${arch}"
          fi
          {
            echo "version=${version}"
            echo "primary=${primary}"
            echo "list<<EOF"
            printf '%s\n' "${primary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional override: password: ${{ secrets.GHCR_PUBLISH_TOKEN }} from
      # the container-release environment. Default remains GITHUB_TOKEN.
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ env.PUBLISH_GHCR == 'true' }}
          load: ${{ env.PUBLISH_GHCR != 'true' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: ${{ env.PUBLISH_GHCR == 'true' }}
          sbom: false
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: node scripts/ci/oci-image-smoke.mjs ${{ matrix.name }}:local

  opensesame-amd64:
    name: opensesame-amd64
    needs: opensesame-amd64-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH_GHCR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore
      - name: Download prebuilt opensesame binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opensesame-amd64-binary
          path: ops/compose/prebuilt
      - name: Check prebuilt opensesame binary
        run: |
          set -euo pipefail
          test -f ops/compose/prebuilt/opensesame
          chmod 0755 ops/compose/prebuilt/opensesame

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/compose/Dockerfile
          IMAGE_ID: opensesame-amd64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: opensesame
          PLATFORM: linux/amd64
          PUBLISH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GHCR}" != "true" ]]; then
            {
              echo "version=0.0.0-local"
              echo "primary=${IMAGE_NAME}:local"
              echo "list<<EOF"
              printf '%s\n' "${IMAGE_NAME}:local"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          arch="${PLATFORM#linux/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            primary="${image}:${version}-${arch}"
          else
            version="0.0.0-next"
            primary="${image}:sha-${GITHUB_SHA}-${arch}"
          fi
          {
            echo "version=${version}"
            echo "primary=${primary}"
            echo "list<<EOF"
            printf '%s\n' "${primary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional override: password: ${{ secrets.GHCR_PUBLISH_TOKEN }} from
      # the container-release environment. Default remains GITHUB_TOKEN.
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/compose/Dockerfile
          target: runtime-from-prebuilt
          push: ${{ env.PUBLISH_GHCR == 'true' }}
          load: ${{ env.PUBLISH_GHCR != 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: ${{ env.PUBLISH_GHCR == 'true' }}
          sbom: false
          cache-from: type=gha,scope=opensesame-amd64
          cache-to: type=gha,mode=max,scope=opensesame-amd64

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: node scripts/ci/oci-image-smoke.mjs opensesame:local

  # id: web-pwa-amd64
  web-pwa-amd64:
    name: web-pwa-amd64
    needs: web-pwa-tailscale-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH_GHCR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            apps
            crates
            packages
            examples
            patches
            scripts
            tools
            ops
            spec
            marketplace
            tests
            /package.json
            /package-lock.json
            /mise.toml
            /mise.lock
            /pnpm-workspace.yaml
            /rust-toolchain.toml
            /Cargo.toml
            /Cargo.lock
            /turbo.json
            /biome.json
            /tsconfig.base.json
            /.env.schema
            /.dockerignore

      - name: Restore prepared Tailscale WASM distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-pwa-tailscale-distributions
          path: .cache/pwa-tailscale-native-http/distributions

      - name: Check Dockerfile
        id: dockerfile
        env:
          DOCKERFILE: ops/containers/web-pwa/Dockerfile
          IMAGE_ID: web-pwa-amd64
        run: |
          set -euo pipefail
          if [[ -f "${DOCKERFILE}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_ID}"
          fi

      - name: Image tags
        id: tags
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE_NAME: web-pwa
          PLATFORM: linux/amd64
          PUBLISH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GHCR}" != "true" ]]; then
            {
              echo "version=0.0.0-local"
              echo "primary=${IMAGE_NAME}:local"
              echo "list<<EOF"
              printf '%s\n' "${IMAGE_NAME}:local"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          arch="${PLATFORM#linux/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            primary="${image}:${version}-${arch}"
          else
            version="0.0.0-next"
            primary="${image}:sha-${GITHUB_SHA}-${arch}"
          fi
          {
            echo "version=${version}"
            echo "primary=${primary}"
            echo "list<<EOF"
            printf '%s\n' "${primary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional override: password: ${{ secrets.GHCR_PUBLISH_TOKEN }} from
      # the container-release environment. Default remains GITHUB_TOKEN.
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        id: build
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/containers/web-pwa/Dockerfile
          target: runtime
          push: ${{ env.PUBLISH_GHCR == 'true' }}
          load: ${{ env.PUBLISH_GHCR != 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: ${{ env.PUBLISH_GHCR == 'true' }}
          sbom: false
          cache-from: type=gha,scope=web-pwa-amd64
          cache-to: type=gha,mode=max,scope=web-pwa-amd64

      - name: Smoke image
        if: steps.dockerfile.outputs.present == 'true' && env.PUBLISH_GHCR != 'true'
        run: node scripts/ci/oci-image-smoke.mjs web-pwa:local

  manifests:
    name: Manifest ${{ matrix.name }}
    needs: [images, opensesame-amd64, web-pwa-tailscale-wasm, web-pwa-amd64]
    if: needs.images.result == 'success' && needs['opensesame-amd64'].result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs['web-pwa-amd64'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opensesame
            file: ops/compose/Dockerfile
            platforms: amd64
          - name: cli
            file: ops/containers/cli/Dockerfile
            platforms: amd64 arm64
          - name: web-pwa
            file: ops/containers/web-pwa/Dockerfile
            platforms: amd64
          - name: control-plane
            file: ops/containers/control-plane/Dockerfile
            platforms: amd64 arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/compose/Dockerfile
            /ops/containers/cli/Dockerfile
            /ops/containers/web-pwa/Dockerfile
            /ops/containers/control-plane/Dockerfile
      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Publish manifest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.file }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          if [[ ! -f "${DOCKERFILE}" ]]; then
            echo "::notice::${DOCKERFILE} is absent on this revision; skipping ${IMAGE_NAME}"
            exit 0
          fi
          image="ghcr.io/opensesame-labs/${IMAGE_NAME}"
          sources=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            canonical=("${image}:${version}" "${image}:latest")
            for arch in ${PLATFORMS}; do
              sources+=("${image}:${version}-${arch}")
            done
          else
            canonical=("${image}:next" "${image}:sha-${GITHUB_SHA}")
            for arch in ${PLATFORMS}; do
              sources+=("${image}:sha-${GITHUB_SHA}-${arch}")
            done
          fi
          for source in "${sources[@]}"; do
            docker buildx imagetools inspect "${source}" >/dev/null
          done
          args=()
          for tag in "${canonical[@]}"; do
            args+=(-t "${tag}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

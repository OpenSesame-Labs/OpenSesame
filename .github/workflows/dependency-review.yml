# Reviews the dependency changes a pull request introduces, before they merge.
#
# The audit gates (`npm run audit:osv`, `audit:cargo-audit`, `audit:cve-lite`)
# scan whole lockfiles from hooks and on a schedule. This job answers a
# narrower question that only exists at review time: which packages does this
# pull request add or move, and does any of them carry a known advisory?
#
# It reads the dependency graph diff through the API. The narrowly attested
# source backport below also checks out the pull request with persisted Git
# credentials disabled, installs without lifecycle scripts and runs with only
# read access. It receives no secret.
# It is an exception to "trunk only builds" recorded in ADR 0222, and it is
# not a required check: a path-filtered required check would leave unrelated
# pull requests pending.

name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/go.mod"
      - "**/go.sum"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/gradle/libs.versions.toml"
      - ".npmrc"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: node
      # glob has not published versions beyond 10.5.0/11.1.0 with its abort
      # fix. Before excluding that one version-only advisory, prove that every
      # installed 10.5.0 copy is the integrity-pinned vendor tarball, that the
      # tarball is exactly the published source plus the reviewed patch, and
      # that real CJS/ESM promise and stream consumers stop reading on abort.
      - name: Attest the glob cancellation backports
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/security/patched-dependencies.mjs verify glob@10.5.0
          node scripts/security/patched-dependencies.mjs verify glob@11.1.0
          node --test \
            --test-name-pattern="the lockfile installs every copy" \
            scripts/security/patched-dependencies.test.mjs
          node --test \
            --test-name-pattern="glob 10, 11 and 13 stop" \
            scripts/security/removed-dependencies.test.mjs
      - name: Fail on any advisory in an added or changed dependency
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The local gates accept no advisory at any severity; neither does this.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # GHSA-3g3m-2fjr-6pw4 is excluded only after the exact 10.5.0 source
          # backport and its cancellation behavior are attested above. No
          # package, scope or severity class is otherwise exempted.
          allow-ghsas: GHSA-3g3m-2fjr-6pw4
          # The result stays in the job summary. No pull-request write access.
          comment-summary-in-pr: never

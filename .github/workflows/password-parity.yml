name: Password workflow parity
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions: {}
concurrency:
  group: password-parity-${{ github.run_id }}-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  parity:
    name: 2password parity gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      VITE_BASE: /OpenSesame/
    permissions:
      contents: read
    steps:
      # Trusted helpers land first. actions/checkout wipes the workspace when
      # the candidate checkout is not yet a git directory, so park them until
      # that checkout finishes, then hide the nested tree from the size gate.
      - name: Check out trusted pipeline helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-control
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/release
            scripts/lib
      - name: Park trusted helpers outside the candidate checkout
        run: mv .ci-control "$RUNNER_TEMP/ci-control"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Restore trusted helpers beside the candidate tree
        run: |
          mv "$RUNNER_TEMP/ci-control" .ci-control
          printf '%s\n' '.ci-control/' >> .git/info/exclude
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: node
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          lookup-only: true
          save-if: false
          workspaces: '. -> .cache/cargo-target'
      - name: Install Linux keychain build and test dependencies
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild and exercise every declared parity contract
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          npm run test:2password-parity
      - name: Preserve assertion reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: password-parity-reports
          path: work/2password*report.json
          if-no-files-found: error

name: Full TypeScript suite

# Development delivery tests the exact selected candidate source. This complete
# workspace suite catches failures outside the latest integration diff, while
# trunk only compiles the impacted build graph.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions: {}

jobs:
  typescript-full:
    name: Full TypeScript suite
    needs: admit
    runs-on: ubuntu-latest
    # Complete serial candidate workload; retain individual test deadlines.
    timeout-minutes: 180
    services:
      postgres:
        # The same mirror and digest as ci.yml (see the comment there).
        image: mirror.gcr.io/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: opensesame
          POSTGRES_PASSWORD: opensesame
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensesame"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      # Trusted helpers land first. actions/checkout wipes the workspace when
      # the candidate checkout is not yet a git directory, so park them until
      # that checkout finishes, then hide the nested tree from the size gate.
      - name: Check out trusted pipeline helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-control
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/release
            scripts/lib
      - name: Park trusted helpers outside the candidate checkout
        run: mv .ci-control "$RUNNER_TEMP/ci-control"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.admit.outputs.revision }}
      - name: Restore trusted helpers beside the candidate tree
        run: |
          mv "$RUNNER_TEMP/ci-control" .ci-control
          printf '%s\n' '.ci-control/' >> .git/info/exclude
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: node
      - name: Install
        run: npm ci --ignore-scripts
      - name: Prepare and verify native PWA assets before package concurrency
        # Uses the normal Vite asset loader, including verification on cache hits.
        # Cold preparation keeps its original deadlines, pins and resource limits.
        run: >-
          node --input-type=module -e
          'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - name: Typecheck and test every package
        run: npm exec -- turbo run typecheck test --concurrency=1
      - name: CUA password-reset browser e2e
        # Explicit delivery coverage: these real-browser tests are excluded
        # from the package's unit-test script.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: >-
          AGENT_BROWSER="$(cd packages/cua-password-reset && realpath "$(npm exec -- which agent-browser)")"
          npm run test:e2e -w @opensesame/cua-password-reset
      - name: Agent sandbox providers browser e2e
        # Exercise the local, relay, virtual-network and CDP lanes.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: >-
          AGENT_BROWSER="$(cd packages/cua-password-reset && realpath "$(npm exec -- which agent-browser)")"
          npm run test:e2e -w @opensesame/agent-sandboxes
      - name: Repository contract on a real Postgres
        env:
          DATABASE_URL: postgres://opensesame:opensesame@127.0.0.1:5432/postgres
          OPENSESAME_CLAIM_PEPPER: ci-pepper-ci-pepper-ci-pepper-ci-pepper
        run: npm run test:postgres -w @opensesame/database
      - name: Worker delivery on a real Postgres
        env:
          DATABASE_URL: postgres://opensesame:opensesame@127.0.0.1:5432/postgres
        run: npm run test:postgres -w @opensesame/identity-worker

  # The candidate is admitted before any job fetches it: only a full commit
  # already on the default branch. This job holds the token and checks out
  # the workflow SHA only; candidate jobs read its output, never the raw input
  # (scripts/release/admit-candidate-source.mjs, docs/security/actions-security.md).
  admit:
    name: Admit candidate source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.admitted.outputs.revision }}
    steps:
      - name: Check out the trusted candidate admission helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release/admit-candidate-source.mjs
            scripts/lib/json-boundary.mjs
      - name: Admit only a candidate already on the default branch
        id: admitted
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: node scripts/release/admit-candidate-source.mjs

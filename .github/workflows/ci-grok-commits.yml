# Fast PR gate: every commit must be GitHub-verified and Grok-authored.
name: Grok signed commits

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: grok-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grok-commits:
    name: Grok signed commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/lib
            scripts/release
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Verify Grok-authored verified commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/check-pr-grok-commits.mjs
          "$GITHUB_REPOSITORY"
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.head.sha }}"

# Fast PR gate: every commit on the PR must carry a GitHub-verified signature
# (the branch ruleset requires verified signatures). Authorship is not checked:
# a commit does not need to involve Grok.
#
# The name below is historical. This job used to demand Grok attribution as well.
# It is kept because the default-branch ruleset requires the status context
# "Grok signed commits" by name (ops/github/default-branch.json); renaming the job
# without changing the ruleset first would leave that required check pending on
# every PR.
name: Grok signed commits

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: grok-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grok-commits:
    name: Grok signed commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/lib
            scripts/release
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Verify commit signatures
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/check-pr-signatures.mjs
          "$GITHUB_REPOSITORY"
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.head.sha }}"

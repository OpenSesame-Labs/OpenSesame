# Fast PR gate: every introduced commit must be GitHub-verified and attributed
# to a recognised agent or human. The script is check-pr-grok-commits.mjs.
#
# The result is reported under two names. "Grok signed commits" is the
# historical one. "Agent attribution" is the one ops/github/default-branch.json
# requires once an administrator applies it. Reporting both means the apply
# can happen at any time without leaving a required check pending on every
# pull request, and neither name has to be renamed in step with a setting.
name: Grok signed commits

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: grok-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grok-commits:
    name: Grok signed commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/lib
            scripts/release
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Verify agent-attributed verified commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/check-pr-grok-commits.mjs
          "$GITHUB_REPOSITORY"
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.head.sha }}"

  agent-attribution:
    # The same result under the declared name. It runs whenever the job above
    # was due to run, and fails unless that job succeeded: a skipped or
    # cancelled check must never read as attribution.
    name: Agent attribution
    needs: grok-commits
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Report the attribution result under its declared name
        env:
          RESULT: ${{ needs.grok-commits.result }}
        run: '[ "$RESULT" = success ]'

    <style>
      /* The device's vault state is not known until boot completes. */
      body { margin: 0; background: #fafafa; color: #171717; }
      .boot { min-height: 100vh; display: grid; align-content: start; justify-items: center; gap: 1.25rem; padding: 2rem 1.25rem; box-sizing: border-box; font: 0.875rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .boot__content { width: min(100%, 30rem); display: grid; justify-items: center; gap: 0.9rem; padding: 2.4rem 0; text-align: center; }
      .boot__hero { width: 100%; margin: 0; line-height: 0; color: inherit; }
      .boot__wordmark { display: block; width: 100%; height: auto; }
      .boot__lede { color: #4d4d4d; font: 0.9375rem/1.5 system-ui, sans-serif; }
      .boot__status { font: 0.875rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .boot__notes { width: min(100%, 30rem); box-sizing: border-box; background: #ededed; padding: 1.25rem 0.85rem; }
      .boot__notes h2 { margin: 0; padding-bottom: 1rem; border-bottom: 1px solid #bdbdbd; font: 600 1.125rem/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .boot p { margin: 0; }
      .boot__slit { fill: var(--mark-slit, #8f8f8f); }
      @media (prefers-color-scheme: dark) {
        body { background: #0f0f0f; color: #f5f5f5; }
        .boot__slit { fill: var(--mark-slit, #666666); }
        .boot__lede { color: #b3b3b3; }
        .boot__notes { background: #222222; }
        .boot__notes h2 { border-color: #5c5c5c; }
      }
      @media (min-width: 1100px) {
        .boot { grid-template-columns: 1fr 1fr; align-content: stretch; align-items: stretch; gap: 0; padding: 0; }
        .boot__content { width: min(calc(100% - 2.5rem), 30rem); justify-self: end; align-self: center; margin-right: clamp(1.5rem, 4vw, 3.5rem); }
        .boot__notes { width: auto; min-height: 100vh; justify-self: stretch; padding: clamp(2rem, 11.6vh, 7rem) clamp(1.5rem, 3.125vw, 3.25rem) 2rem; box-shadow: inset 1px 0 0 #bdbdbd; }
        .boot__notes h2 { padding-bottom: 1.5rem; font-size: 2.25rem; }
      }
    </style>
    <noscript><style>.boot__status { display: none; }</style></noscript>
    <title>OpenSesame — encrypted vault and agent auth broker</title>
  </head>
  <body>
    <div id="root">
      <main class="boot">
        <div class="boot__content">
          <h1 class="boot__hero" aria-label="open-sesame">
            <svg class="boot__wordmark" viewBox="0 0 778 100" aria-hidden="true" focusable="false">
              <defs>
                <pattern id="boot-particles" width="8" height="8" patternUnits="userSpaceOnUse">
                  <circle cx="2" cy="2.2" r="2.1" fill="currentColor" opacity=".68" />
                  <rect x="4.8" y="4.8" width="3" height="3" fill="currentColor" opacity=".5" />
                </pattern>
                <mask id="boot-letters">
                  <rect x="108" y="6" width="666" height="87" fill="white" />
                  <text x="108" y="76" fill="black" font-family="OS Logo, ui-monospace, monospace" font-size="78" font-weight="800" textLength="666" lengthAdjust="spacingAndGlyphs">OPEN SESAME</text>
                </mask>
              </defs>
              <svg x="4" y="6" width="87" height="87" viewBox="0 0 17 17">
                <path fill="currentColor" d="M0 0h12v17H0z" />
                <path class="boot__slit" d="M14.7 0H17v17h-2.3z" />
              </svg>
              <rect x="108" y="6" width="666" height="87" fill="url(#boot-particles)" mask="url(#boot-letters)" />
            </svg>
          </h1>
          <p class="boot__lede">Set up your own vault, or join one.</p>
          <p class="boot__status" role="status">Opening OpenSesame…</p>
          <noscript><p>OpenSesame needs JavaScript to open the vault on this device.</p></noscript>
        </div>
        <aside class="boot__notes" aria-label="Release notes"><h2>Release Notes</h2></aside>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
